<body>
<!-- Paddock Analysis Workbench, the page behind REVIEW > MORE DATA (app\pages\review-more.js hosts it in the shell's frame; W4-5).
     Open with ?id=<telemetry file name or Vault lap id>&lap=<n>[&ref=pb|session|<id>:<lap>][&page=driver|braking|splits|race]
     or, for tests without irdash, ?data=<url of a /analysis/channels reply>. Everything is drawn by workbench.js; the race field is workbench-race.js
     (the RACE tab exists only when /analysis/race has the session; &race=<field id> names the log). The tabs are DRIVER, BRAKING, SPLITS and RACE:
     GRIP & BALANCE, TYRES & STINT, SUSPENSION, VIDEO, CAREER and PRO are gone (their channels stay readable through + CHANNEL). -->
<div class="top">
  <div class="tabs" id="tabs"></div>
  <div class="addch" id="addch" style="display:none">+ CHANNEL</div>
  <div class="mode" id="mode"></div>
  <div class="vs" id="vs"></div>
</div>
<div id="conditions"></div>
<div id="nav"></div>
<div id="page"></div>
<div id="tools"></div>
<script src="workbench-channels.js"></script>
<script src="workbench.js"></script>
<script src="workbench-share.js"></script><!-- SEE IN iRACING (event rows, passes) -->

<script src="carpics.js"></script><!-- CP-1: iRacing's own car pictures (RACE tower and header) -->
<script src="workbench-race.js"></script>

</body></html>
