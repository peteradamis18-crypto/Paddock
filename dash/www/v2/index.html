<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRacing Dash v2</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="intro.css">
<link rel="stylesheet" href="debrief-v4.css">
<link rel="stylesheet" href="guest.css">
<link rel="stylesheet" href="rig.css">
<link rel="stylesheet" href="data.css">
<link rel="stylesheet" href="mydrive.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="keymsg.css">
<style>#raceHost { position: fixed; inset: 0; z-index: 790; } #raceHost iframe { width: 100%; height: 100%; border: 0; display: block; } #toast { z-index: 795; }</style><!-- under the flag glow (800); HOME hides while it shows; the watchdog's repair notice (#toast) stays above it -->
</head>
<body>
<!-- THE RACE SCREEN (W2-2; race.html, app/pages/race.js): covers HOME while he drives. ui.js RaceSwitch puts the page in here
     (after data.js has run, so it borrows this page's one stream) and shows or hides it. -->
<div id="raceHost" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="keyMsg" role="status" aria-live="polite"></div><!-- keymsg.js: what the last deck key did, 4 s, bottom-centre -->

<!-- HOME: shown whenever he is not driving (the race screen covers it then) -->
<div id="overlay" class="show">
  <!-- HOME v3 (home.js; design docs\design\home-v3\spec.md): band A the one action, his car, is the rig ready; band B next race,
       last outing and the week's numbers; band C what to watch. Hidden with the rest of #overlay the moment a session is live. -->
  <div class="idle-top"><span class="idle-name">Paddock</span><span class="idle-link idle-races" id="idleRaces" tabindex="0" role="button">My races</span><span class="idle-link" id="idleSessions" tabindex="0" role="button">Sessions</span><span id="idleDate"></span><span id="idleClock">&#8212;</span></div>
  <button class="home-next" id="homeNext" type="button" hidden></button>
  <section id="homeDriver"></section>
  <div class="home-car" id="homeCar"></div>
  <div class="home-phone" id="homePhone" hidden></div>
  <section class="home-ready" id="idleRig"></section>
  <div class="home-hr" style="top:476px"></div>
  <section class="home-race" id="homeRace"></section>
  <section class="home-last" id="homeLast"></section>
  <div class="home-hr" style="top:784px"></div>
  <section class="home-weekend" id="homeWeekend"></section>
  <div class="idle-foot" hidden><span class="idle-status"><i></i><b id="ovTitle">Waiting for iRacing</b><em id="ovText"></em></span><span class="foot-phone" id="homePhoneNote" hidden></span></div>
  <div id="homeHost" hidden></div>
</div>

<script src="../app/lib/data.js"></script><!-- W0-5: the one connection to irdash (state push) -->
<script src="core.js"></script>
<script src="map.js"></script>
<script>if (/[?&]demo=1/.test(location.search)) document.write('<script src="demo.js"><' + '/script>');</script><!-- demo data only when asked: ?demo=1 -->
<script src="ui.js"></script>
<script src="carpics.js"></script><!-- CP-1: iRacing's own car pictures (HOME shows his own) -->
<script src="home.js"></script>
<script src="debrief-v4.js"></script>
<script src="guest.js"></script>
<script src="rig.js"></script>
<script src="pagehost.js"></script><!-- one manager for the pages over the dashboard (Sessions, Vault, Performance) -->
<script src="nav.js"></script>
<script src="brief.js"></script>
<script src="flaglow.js"></script>
<script src="perflive.js"></script>
<script src="vaultlive.js"></script>
<script src="mydrive.js"></script>
<script src="intro.js"></script>
<script src="keymsg.js"></script>
</body>
</html>
