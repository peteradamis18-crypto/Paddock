    if (race.kept) add(3, 2, 1, 1, 'KEPT', 'FOR GOOD', null, null, 'grey', 2, { size: 26, noflash: true });
    else add(3, 2, 1, 1, 'KEEP', 'FOR GOOD', 'recsave', race.id, '', 2, { size: 26 });
    const link = shared && (race.state || {}).url ? /(?:youtu\.be\/|[?&]v=)([\w-]+)/.exec(race.state.url) : null;
    // parts, not text: a YouTube address is case-sensitive (the renderer capitalises) and must not cross a key gap
    if (link) add(4, 2, 2, 1, 'youtu.be/' + link[1], 'LINK ON THE PAGE', null, null, 'banner', 0, { noflash: true, parts: { main: ['youtu.be/', link[1]], sub: ['LINK ON', 'THE PAGE'] } });
    // W1-6: TALK OVER IT, and the version with his commentary once it is mixed (a second video of its own)
    const tk = (race.talk || {}).kind || 'none', tyt = ((race.talk || {}).yt || {}).kind || 'none';
    if (tk !== 'shared') add(6, 2, 1, 1, 'TALK', 'OVER IT', 'talkone', race.id, 'sel', 2, { size: 26 });
    if (tk === 'shared') add(7, 2, 1, 1, 'COMMENT.', 'ON YOUTUBE', null, null, 'grey', 2, { size: 20, noflash: true });
    else if (tk === 'ready' && (tyt === 'queued' || tyt === 'sharing' || tyt === 'offline' || tyt === 'signin')) add(7, 2, 1, 1, 'COMMENT.', tyt === 'sharing' ? 'SHARING ' + Math.round(race.talk.yt.pct || 0) + '%' : 'WAITING', null, null, 'grey', 2, { size: 20, noflash: true });
    else if (tk === 'ready') add(7, 2, 1, 1, 'SHARE', 'COMMENTARY', 'sharetalk', race.id, 'sel', 2, { size: 24 });
    else if (tk === 'failed') add(7, 2, 1, 1, /microphone/i.test(race.talk.error || '') ? 'NO MIC' : race.talk.error ? 'TALK' : 'STOPPED', /microphone/i.test(race.talk.error || '') ? 'PLUG IN HEADSET' : race.talk.error ? 'DID NOT WORK' : 'SESSION ON', null, null, 'amber', 2, { size: 22, noflash: true });
    add(0, 3, 1, 1, 'BACK', 'ALL RACES', 'back', null, 'grey', 2);
    if (undo) add(1, 3, 3, 1, 'DELETED ' + undo.n + ' · UNDO', '', 'undo', null, 'sel', 2, { size: 22 });
    if (msg) add(undo ? 4 : 1, 3, undo ? 3 : 6, 1, msg.text, '', null, null, msg.style, 2, { size: 22, noflash: true });
    R.push(exitRegion());
    return R;
  }
};

// ---------------- Confirm screen (SHUT DOWN PC / SLEEP PC on the LEAVE page, W0-1) ----------------
// The LEAVE page used to turn the PC off in one press, and Stream Deck could reopen on that page after a wake (audit 11,
// top finding 1). Now the key only opens this screen: one big gold YES with 5-4-3-2-1 on it, and EXIT at 7,3. Only YES
// sends the command (irdash /api/do?c=shutdown or sleep -> irdeck power off / sleep). Nothing pressed for 5 s: the
// screen closes itself and nothing happens. A doubled YES is one press (once, and nothing more after it was sent).
const CONFIRM_WHAT = {
  shutdown: { key: ['SHUT DOWN', 'PC'], ask: 'TURN THE PC OFF?', yes: 'YES, SHUT DOWN', doing: 'SHUTTING DOWN', cmd: 'shutdown' },
  sleep: { key: ['SLEEP', 'PC'], ask: 'PUT THE PC TO SLEEP?', yes: 'YES, SLEEP', doing: 'GOING TO SLEEP', cmd: 'sleep' },
};
const Confirm = new class extends Screen {
  constructor() {
    super('confirm');
    this.what = 'shutdown'; this.until = 0; this.sentAt = 0; this.token = 0;
    this.interval = 200;
  }
  hasState() { return true; }
  whatOf(ctx) { const s = this.keySettings[ctx] || {}; return CONFIRM_WHAT[s.what] ? s.what : 'shutdown'; }
  greyWord(ctx) { return CONFIRM_WHAT[this.whatOf(ctx)].key.join(' '); }
  keyIcon(force) {
    if (!this.keys.size || (!force && this.keyShown)) return;
    this.paintOpener();   // SHUT DOWN PC / SLEEP PC: each key's own layout entry (its settings say which)
    this.keyShown = '1';
  }
  async keyTick() { this.keyIcon(false); }
  secondsLeft() { return Math.max(0, Math.ceil((this.until - performance.now()) / 1000)); }

  async open(opts) {
    if (!deviceId) return;
    const ctx = opts && opts.ctx;
    this.what = (opts && CONFIRM_WHAT[opts.what]) ? opts.what : ctx ? this.whatOf(ctx) : 'shutdown';
    this.sentAt = 0; this.answer = ''; this.shown = {}; this.until = performance.now() + 5000; this.openedAt = performance.now();
    const tok = ++this.token;
    log('confirm: ' + this.what + ' asked; closes by itself in 5 s');
    this.switchTo('RigConfirm');
    this.warm();
    // irdash takes YES only within 5 s of this arm, with the X-Paddock header (a web page or a stray GET cannot end the PC)
    this.paddock('confirmarm', CONFIRM_WHAT[this.what].cmd);
    // the run() loop repaints the count; this makes sure the screen closes even if no tile ever appears
    later(5200, () => { if (this.token === tok && !this.sentAt) { log('confirm: ' + this.what + ' not confirmed - nothing done'); this.exit(); } });
  }
  exit() { this.token++; this.until = 0; this.switchTo(''); }

  async poll() {
    if (this.sentAt) { if (performance.now() - this.sentAt > 2500) this.exit(); return; }
    if (this.until && performance.now() >= this.until) { log('confirm: ' + this.what + ' not confirmed - nothing done'); this.exit(); return; }
    this.relayout();
  }

  // confirmarm / shutdown / sleep carry X-Paddock: 1; the answer text comes back ('ok', 'kids', 'no', or '' when irdash did not answer)
  async paddock(c, a) {
    try { const r = await sendCmd('/api/do?c=' + encodeURIComponent(c) + (a ? '&a=' + encodeURIComponent(a) : '')); return (await r.text()).trim(); }
    catch (e) { log('confirm: irdash not reachable (' + c + ')'); return ''; }
  }

  async act(r) {
    // SLEEP PC sits at 7,3 where EXIT is: a doubled opener press (29 ms - 1 s later) would land on EXIT or YES. The first second is deaf.
    if (performance.now() - (this.openedAt || 0) < 1000) return;
    if (r.act === 'exit') { this.exit(); return; }
    if (r.act !== 'yes' || this.sentAt || !this.until || performance.now() >= this.until) return;
    this.sentAt = performance.now();
    log('confirm: YES - ' + this.what);
    this.relayout();
    const ans = await this.paddock(CONFIRM_WHAT[this.what].cmd);
    if (ans !== 'ok') { this.answer = ans === 'kids' ? 'kids' : 'no'; this.sentAt = performance.now(); log('confirm: irdash said ' + (ans || 'nothing') + ' - nothing done'); this.relayout(); }
  }

  build() {
    const w = CONFIRM_WHAT[this.what], R = [];
    const add = (c, r, wd, h, text, sub, act, style, more) => { const o = { c, r, w: wd, h, text, sub, act, arg: null, style: style || '', once: true }; if (more) Object.assign(o, more); R.push(o); };
    if (this.sentAt && this.answer) {
      add(0, 0, 8, 3, this.answer === 'kids' ? 'KIDS MODE IS ON' : 'NOT DONE', this.answer === 'kids' ? 'Unlock first: KIDS, then HOME' : 'The dashboard did not take it. Try again.', null, 'amber', { wrap: 2, size: 44, noflash: true });
      return R;
    }
    if (this.sentAt) {
      add(0, 0, 8, 3, w.doing, 'iRacing is closed first if it is open', null, 'amber', { wrap: 2, size: 44, noflash: true });
      return R;
    }
    // the question big on the top row; the rule small on the bottom row (two lines of runs on one row read out of order)
    const hint = 'Press YES within 5 seconds. Nothing happens if you wait.';
    add(0, 0, 8, 1, w.ask, hint, null, 'banner', { size: 30, noflash: true, paint: raceSpan({ main: raceSplit(w.ask.toUpperCase(), 8, 8), sub: [] }, 8, 1, 30) });
    add(0, 3, 7, 1, hint, '', null, 'hint', { noflash: true, paint: raceSpan({ main: ['PRESS', 'YES IN', '5 SEC.', 'NOTHING', 'HAPPENS', 'IF YOU', 'WAIT'], sub: [] }, 7, 1, 18) });
    // the count is painted big on the YES key itself (sub carries it, so each second is a new look)
    const n = String(this.secondsLeft() || 1);
    // 3 keys wide: the count sits in the middle of one key (on a 4-wide key it fell on the gap), and a smaller target is harder to hit by accident
    add(2, 1, 3, 2, w.yes, n, 'yes', 'sel', { paint: (x, px, py, pw, ph, bg, fg) => {
      // words on the top row, one word per key (W3-4: "YES, SHUT DOWN" used to cross the gaps), the count in the middle key below
      raceSpan({ main: raceSplit(w.yes, 3, 5), sub: [] }, 3, 1, 34)(x, px, py, pw, PX - 6, bg, fg);
      x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '700 74px ' + FONT; x.fillText(n, px + PX + (PX - 6) / 2, py + PX + (PX - 6) / 2);
    } });
    R.push(exitRegion());
    return R;
  }
};

// The deck key presses and the profile tiles belong to one of the live screens (by action / by the tile's settings.p).
// W3-4: AI LEVEL folded into the AI RACE screen (mydrive); rig is the RIG door key; the ANALYSIS screen is gone (REVIEW on the top screen has it).
const SCREENS = { friends: Friends, overlays: Overlays, mydrive: MyDrive, replay: Replay, sound: Sound, ac: Ac, races: Races, confirm: Confirm, rig: Rig };

// ---------------- speed test (tests\deck-speed-test.ps1 -Live) ----------------
// irdash's /mydrive says "run a test": open that screen once, time it (perf lines in the log), and go back. Nothing is changed.
async function speedTest(which) {
  const s = SCREENS[which];
  if (!s || !deviceId || playing || s.live) return;
  log('speedtest: opening ' + which + ' (a test; nothing is changed)');
  await s.open({ test: true });
  await sleep(6000);
  s.exit({ test: true });
}

function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info) {
  pluginUUID = uuid;
  try { const i = JSON.parse(info); const xl = (i.devices || []).find(d => d.type === 2) || (i.devices || [])[0]; if (xl) deviceId = xl.id; } catch (e) { }
  ws = new WebSocket('ws://127.0.0.1:' + port);
  ws.onopen = () => { send({ event: registerEvent, uuid }); pollLoop(); };
  ws.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.event === 'deviceDidConnect' && (!deviceId || (e.deviceInfo && e.deviceInfo.type === 2))) deviceId = e.device;
    // a screen's opener key on your profile; the hidden ailevel action (the old AI LEVEL key, one release) opens the AI RACE screen
    const keyScreen = Object.values(SCREENS).find(s => e.action === UUID + '.' + s.name) || (e.action === UUID + '.ailevel' ? MyDrive : null);
    const p = e.payload && e.payload.settings && e.payload.settings.p;
    const tileScreen = !keyScreen && p && SCREENS[p];                                                     // a key of a screen's profile
    const isDocKey = e.action === UUID + '.doctor';
    const pos = e.payload && e.payload.coordinates ? e.payload.coordinates.column + ',' + e.payload.coordinates.row : '';
    if (e.event === 'willAppear') {
      if (keyScreen) {
        keyScreen.keys.add(e.context); keyScreen.keyPos[e.context] = pos; keyScreen.keySettings[e.context] = (e.payload && e.payload.settings) || {}; keyScreen.keyIcon(true);
        if (Health.grey) send({ event: 'setImage', context: e.context, payload: { image: Health.greyPic(keyScreen.greyWord(e.context), 'NOT ANSWERING', keyScreen.openerSpec(e.context)), target: 0 } });
      }
      else if (tileScreen) tileScreen.appear(pos, e.context);
      else if (isDocKey) { docKeys.add(e.context); RigDoctor.icon(true); }
      else if (pos) { tiles[pos] = e.context; send({ event: 'setImage', context: e.context, payload: { image: blank(), target: 0 } }); }
    }
    if (e.event === 'willDisappear') {
      if (keyScreen) { keyScreen.keys.delete(e.context); delete keyScreen.keyPos[e.context]; delete keyScreen.keySettings[e.context]; }
      else if (tileScreen) tileScreen.disappear(pos);
      else if (isDocKey) docKeys.delete(e.context);
      else if (pos) delete tiles[pos];
    }
    if (e.event === 'keyDown') {
      if (keyScreen && deafNow()) { log('press ignored: the deck changed page ' + Math.round(performance.now() - switchedAt) + ' ms ago'); return; }
      if (keyScreen) keyScreen.open(keyScreen === Confirm ? { ctx: e.context } : undefined);
      else if (tileScreen) tileScreen.press(e.payload.coordinates.column, e.payload.coordinates.row);
      else if (isDocKey) RigDoctor.press();
      else { playing = true; back(); }   // any key during (or, by any chance, after) the intro returns to your buttons
    }
  };
}

// W0-5: ONE request every 5 s (/deck/summary: whether to play the intro, and what every opener key paints), and only while an
// opener key is on the deck. It used to be six requests every 2 s, all day, also while Peter raced (audit 11, finding 6). A screen
// that is open asks its own route at its own pace, as before; nothing is asked while no opener key is showing.
const SUMMARY_MS = 5000;
function openerShowing() { return docKeys.size > 0 || Object.values(SCREENS).some(s => s.keys.size > 0); }
async function pollLoop() {
  let last = -1e9;
  for (;;) {
    // looked at 4 times a second (the worker's timer, no request): the first summary comes as soon as the opener keys appear
    if (!playing && openerShowing() && performance.now() - last >= SUMMARY_MS) {
      last = performance.now();
      // the summary doubles as "is irdash answering": three passes without an answer grey the opener keys (Health)
      const before = Health.lastOk;
      let sum = null;
      try { sum = await (await fetchT(API + '/deck/summary')).json(); }
      catch (e) { if (!poll.warned) { poll.warned = true; log('irdash not reachable yet: ' + e); } }
      Health.tick(Health.lastOk > before && !!sum);
      if (sum) {
        try { poll(sum.showcase); } catch (e) { }
        for (const s of [Overlays, Friends, MyDrive, Replay, Sound, Ac, Races, Confirm, Rig]) { try { await s.keyTick(sum); } catch (e) { } }
        try { await RigDoctor.tick(sum); } catch (e) { }
      }
    }
    await sleep(250);
  }
}

function poll(s) {
  if (playing || !s) return;
  if (!poll.ok) { poll.ok = true; log('connected to irdash, seq ' + s.seq + (s.play ? ', boot play' : '')); }
  const replay = seq !== null && s.seq > seq && !s.driving;
  seq = s.seq;
  if (s.play || replay) play();
}

let blankUrl = null;
function blank() { if (!blankUrl) { const c = document.createElement('canvas'); c.width = c.height = PX; const g = c.getContext('2d'); g.fillStyle = C.black; g.fillRect(0, 0, PX, PX); blankUrl = c.toDataURL('image/png'); } return blankUrl; }

async function play() {
  if (playing) return;
  if (!deviceId) { log('no Stream Deck XL found'); return; }
  playing = true;
  const guard = { off: false };
  later(15000, () => { if (!guard.off) back(); });   // never leave the deck on the intro
  try {
    log('playing on ' + deviceId);
    send({ event: 'switchToProfile', context: pluginUUID, device: deviceId, payload: { profile: 'RigIntro' } });
    for (let i = 0; i < 30 && Object.keys(tiles).length < COLS * ROWS; i++) await sleep(100);
    log(Object.keys(tiles).length + ' tiles appeared');
    if (Object.keys(tiles).length === 0) return;
    const big = document.createElement('canvas'); big.width = W; big.height = H;
    const g = big.getContext('2d');
    const tile = document.createElement('canvas'); tile.width = tile.height = PX;
    const tg = tile.getContext('2d');
    // time-based, so a slow frame skips ahead instead of stretching the sequence
    const start = performance.now(), length = 7.2;
    for (let t = 0; t < length; t = (performance.now() - start) / 1000) {
      draw(g, t);
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const ctx = tiles[c + ',' + r]; if (!ctx) continue;
        tg.drawImage(big, c * PX, r * PX, PX, PX, 0, 0, PX, PX);
        send({ event: 'setImage', context: ctx, payload: { image: tile.toDataURL('image/png'), target: 0 } });
      }
      await tick();
    }
    log('sequence done in ' + ((performance.now() - start) / 1000).toFixed(1) + ' s');
  } catch (e) { }
  finally { guard.off = true; back(); }
}

function back() {
  if (!playing) return;
  playing = false;
  switchedAt = performance.now(); send({ event: 'switchToProfile', context: pluginUUID, device: deviceId, payload: {} });   // no name = the previous profile
  log('back to the buttons');
}

const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const fmtTime = t => { t = +t; const m = Math.floor(t / 60), s = t - m * 60; return (m ? m + ':' + (s < 10 ? '0' : '') : '') + s.toFixed(3); };

// The sequence, in seconds: gold hairline, driver card (4 / PETER), the green flag waves across, settle, fade.
function draw(g, t) {
  g.fillStyle = C.black; g.fillRect(0, 0, W, H);
  // 0.0-1.0 hairline draws left to right through the middle
  const hw = ease(t / 1.0) * W;
  // 0.8-3.4 driver card
  const card = t < 0.8 ? 0 : t < 3.6 ? ease((t - 0.8) / 0.8) : Math.max(0, 1 - (t - 3.6) / 0.5);
  if (card > 0) {
    g.save(); g.globalAlpha = card;
    g.strokeStyle = GOLD; g.lineWidth = 3;
    g.font = '300 330px ' + FONT; g.textBaseline = 'alphabetic';
    g.strokeText('4', 22, H - 22);
    g.fillStyle = GOLD; g.font = '600 26px ' + FONT;
    g.fillText('D R I V E R', 230, 150);
    g.fillStyle = INK; g.font = '600 118px ' + FONT;
    g.fillText('PETER', 222, 270);
    g.restore();
  }
  if (t < 4.0) {
    g.fillStyle = GOLD; g.globalAlpha = t < 3.6 ? 1 : Math.max(0, 1 - (t - 3.6) / 0.4);
    g.fillRect(0, 292, hw, 2); g.globalAlpha = 1;   // the rule under the name, as on the top screen
  }
  // 3.8-6.4 the green flag: sweeps in from the left and ripples like cloth
  if (t > 3.8) {
    const p = ease((t - 3.8) / 0.9), edge = p * (W + 200) - 100;
    const fade = t > 6.4 ? Math.max(0, 1 - (t - 6.4) / 0.7) : 1;
    for (let x = 0; x < W; x += 4) {
      if (x > edge) break;
      const wave = Math.sin(x / 70 - t * 7) * 0.5 + 0.5;
      const light = 0.55 + 0.45 * wave;
      const r = Math.round(31 * light), gr = Math.round(191 * light), b = Math.round(95 * light);
      g.fillStyle = 'rgba(' + r + ',' + gr + ',' + b + ',' + fade + ')';
      const sag = Math.sin(x / 90 - t * 7) * 10 * (x / W);
      g.fillRect(x, sag, 4, H);
    }
    if (t > 4.8 && t < 6.6) {
      g.globalAlpha = Math.min(1, (t - 4.8) / 0.4) * fade;
      g.fillStyle = C.greenNight; g.font = '700 74px ' + FONT; g.textAlign = 'center';
      g.fillText('G R E E N', W / 2, H / 2 + 26); g.textAlign = 'left'; g.globalAlpha = 1;
    }
  }
}
