  async readVault(id) {
    this.vtId = id; this.vtAt = performance.now();
    let item = null, vault = null;
    try { item = await this.get('/vault/item?id=' + encodeURIComponent(id)); } catch (e) { }
    try { vault = await this.get('/vault'); } catch (e) { }
    const m = item && item.m;
    this.vt = { inVault: !!m, pinned: !!(m && m.pinned), keeper: !!(m && m.keeper), cosworth: !!((item && item.cosworth && item.cosworth.installed) || (vault && vault.cosworth && vault.cosworth.installed)) };
  }

  async act(r) {
    const a = this.a;
    // D-05: the DEBRIEF row on the ANALYSIS screen (SAVE / SHARE / COSWORTH / DEEP DIVE). The debrief id is the one the
    // /debrief/state reply named; irdash refuses anything else and does nothing.
    if (r.act && r.act.indexOf('db-') === 0) {
      await this.cmd(r.act, this.db && this.db.id ? this.db.id : '');
      await this.refreshSoon(400);
      return;
    }
    // a press reaches the add-on two or three times: whatever arrives within 0.8 s of the picker opening or closing is the same press again,
    // and on the other layout its key would be a different one (a page key in the picker is LAP / CORNER keys outside it)
    if (r.act !== 'pagesback' && performance.now() - this.pickerAt < 800 && (this.picker ? r.act === 'wb-page' : true)) return;
    if (r.act === 'back') { this.exit(); return; }
    if (r.act === 'pages') { this.picker = true; this.pickerAt = performance.now(); this.relayout(); return; }
    if (r.act === 'pagesback') { if (this.picker) { this.picker = false; this.pickerAt = performance.now(); this.relayout(); } return; }
    if (r.act === 'keep') {
      const want = !this.cur('pinned', this.vt ? this.vt.pinned : false);
      this.hold('pinned', want); this.relayout();
      await this.cmd('wbkeep', want ? '1' : '0');
      await sleep(300); await this.readVault(a.id); this.relayout();
      return;
    }
    if (r.act === 'cosworth') { this.flashUntil = Date.now() + 3000; this.relayout(); await this.cmd('wbcosworth'); return; }
    // the workbench commands: the change shows at once, the page confirms a moment later
    if (r.act === 'wb-toggle-play') this.hold('playing', !this.cur('playing', a.playing));
    if (r.act === 'wb-tile') this.hold('tile', !this.cur('tile', a.tile));
    if (r.act === 'wb-speed') { const i = WB_SPEEDS.indexOf(this.cur('speed', a.speed)); this.hold('speed', WB_SPEEDS[(i + 1) % WB_SPEEDS.length]); }
    if (r.act === 'wb-page') { this.hold('page', r.arg); if (this.picker) { this.picker = false; this.pickerAt = performance.now(); } }   // a page picked in the picker closes it
    if (r.act === 'wb-map-colour') this.hold('mc', this.cur('mc', a.mapColour) === 'gap' ? 'speed' : 'gap');
    this.relayout();
    await this.cmd(r.act, r.arg);
    await this.refreshSoon(250);
  }

  build() {
    const a = this.a, R = [];
    const add = (c, r, w, h, text, sub, act, arg, style, wrap, more) => { const o = { c, r, w, h, text, sub, act, arg, style: style || '', wrap: wrap || 0 }; if (more) Object.assign(o, more); R.push(o); };
    add(0, 0, 1, 1, 'BACK', 'TO KEYS', 'back', null, 'grey');
    if (a.off || a.driving || !a.open) {
      this.picker = false;
      // nothing to drive: say why in plain words
      const why = a.off ? ['NOT READY', 'Needs the dashboard update'] : a.driving ? ['GET OUT OF THE CAR', '']
        : ['NO LAP OPEN', 'Press ANALYSIS in the session review, or open a lap from the Vault'];
      add(1, 0, 7, 1, 'ANALYSIS', '', null, null, 'banner');
      add(0, 1, 8, 1, why[0], '', null, null, 'amber', 0, { size: 44 });      // one row each: text across the gap between two rows of keys is hard to read
      add(0, 2, 8, 1, why[1], '', null, null, 'amber', 2, { size: 22 });
      // D-05: the DEBRIEF row (the bottom row): one press for each thing the debrief on the top screen offers.
      // All four are dim until a debrief is showing; then each one is live only when its action is actually available.
      const db = this.db, dd = (db && db.deepDive) || {}, dbOk = !!(db && db.open && db.id);
      const canSave = dbOk && !!db.recId, canShare = dbOk && !!db.shareId, canCos = dbOk && this.dbCw && !!dd.id, canDeep = dbOk && !!dd.id && dd.cornerN > 0;
      add(0, 3, 2, 1, dbOk && db.saved ? 'SAVED' : 'SAVE', '', canSave ? 'db-save' : null, null, canSave ? (db.saved ? 'sel' : '') : 'dim', 2);
      add(2, 3, 2, 1, 'SHARE', '', canShare ? 'db-share' : null, null, canShare ? '' : 'dim', 2);
      add(4, 3, 2, 1, 'COSWORTH', '', canCos ? 'db-cosworth' : null, null, canCos ? '' : 'dim', 2);
      add(6, 3, 2, 1, 'DEEP DIVE', '', canDeep ? 'db-deepdive' : null, null, canDeep ? '' : 'dim', 2);
      return R;
    }
    const gap = a.refTime != null ? a.lapTime - a.refTime : null;
    add(1, 0, 5, 1, 'LAP ' + a.lap + '   ' + wbLap(a.lapTime), a.refTime != null ? 'vs ' + wbRef(a.ref) + ' ' + wbLap(a.refTime) + '   ' + (gap > 0 ? '+' : gap < 0 ? '−' : '') + Math.abs(gap).toFixed(3) : 'no reference lap', null, null, 'banner');
    // KEEP the lap / open it in Pi Toolbox (only when it is installed). Both need the lap to be in the Vault.
    const vt = this.vt, inVault = !!(vt && vt.inVault), pinned = this.cur('pinned', vt ? vt.pinned : false), kept = pinned || !!(vt && vt.keeper);
    if (!inVault) add(6, 0, 1, 1, 'KEEP', vt ? 'NOT IN VAULT' : '', null, null, 'dim', 2);
    else add(6, 0, 1, 1, kept ? 'KEPT' : 'KEEP', pinned ? 'TAP TO LET GO' : kept ? 'AUTO-KEPT' : 'THIS LAP', 'keep', null, kept ? 'sel' : '', 2, { once: true });
    if (vt && vt.cosworth) {
      if (Date.now() < this.flashUntil) add(7, 0, 1, 1, 'OPENING', 'COSWORTH', null, null, 'go', 2);
      else add(7, 0, 1, 1, 'COSWORTH', inVault ? '' : 'NOT IN VAULT', inVault ? 'cosworth' : null, null, inVault ? '' : 'dim', 2, { once: true });
    }
    // row 2: move through the lap
    const lapsOk = a.laps > 1, cornersOk = a.corners > 0, eventsOk = a.events > 0, playing = this.cur('playing', a.playing), speed = this.cur('speed', a.speed);
    add(0, 1, 1, 1, '◀ LAP', lapsOk ? 'PREVIOUS' : 'ONLY ONE', lapsOk ? 'wb-lap-prev' : null, null, lapsOk ? '' : 'dim', 2);
    add(1, 1, 1, 1, 'LAP ▶', lapsOk ? 'NEXT' : 'ONLY ONE', lapsOk ? 'wb-lap-next' : null, null, lapsOk ? '' : 'dim', 2);
    add(2, 1, 1, 1, '◀ CORNER', cornersOk ? 'PREVIOUS' : 'NONE FOUND', cornersOk ? 'wb-prev-corner' : null, null, cornersOk ? '' : 'dim', 2);
    add(3, 1, 1, 1, 'CORNER ▶', cornersOk ? 'NEXT' : 'NONE FOUND', cornersOk ? 'wb-next-corner' : null, null, cornersOk ? '' : 'dim', 2);
    add(4, 1, 1, 1, '◀ EVENT', eventsOk ? 'PREVIOUS' : 'NONE FOUND', eventsOk ? 'wb-prev-event' : null, null, eventsOk ? '' : 'dim', 2);
    add(5, 1, 1, 1, 'EVENT ▶', eventsOk ? 'NEXT' : 'NONE FOUND', eventsOk ? 'wb-next-event' : null, null, eventsOk ? '' : 'dim', 2);
    add(6, 1, 2, 1, playing ? 'PAUSE' : 'PLAY', playing ? 'PLAYING ×' + speed : 'PAUSED', 'wb-toggle-play', null, playing ? '' : 'go', 0, { once: true });
    // row 3: how it looks
    const tile = this.cur('tile', a.tile), mc = this.cur('mc', a.mapColour);
    add(0, 2, 1, 1, 'ZOOM −', 'OUT', 'wb-zoom-out', null, '', 2);
    add(1, 2, 1, 1, 'ZOOM +', 'IN', 'wb-zoom-in', null, '', 2);
    add(2, 2, 1, 1, 'WHOLE LAP', a.zoomed ? 'ZOOMED IN' : 'ALL IN VIEW', 'wb-zoom-reset', null, a.zoomed ? 'sel' : '', 2);
    add(3, 2, 1, 1, 'SPEED', '×' + speed, 'wb-speed', null, speed !== 1 ? 'sel' : '', 2);
    add(4, 2, 1, 1, 'COMPARE', wbRef(a.ref), 'wb-ref-cycle', null, '', 2);
    add(5, 2, 1, 1, 'OFFSET AUTO', a.offset ? (a.offset > 0 ? '+' : '−') + Math.abs(a.offset) + ' M' : 'AUTO', 'wb-offset-auto', null, a.offset ? 'sel' : '', 2);
    add(6, 2, 1, 1, 'TILE', tile ? 'ON' : 'OFF', 'wb-tile', null, tile ? 'on' : 'off', 0, { once: true });
    add(7, 2, 1, 1, 'MAP COLOUR', String(mc).toUpperCase(), 'wb-map-colour', null, '', 2);
    // row 4: the pages the workbench has (only when there is a choice). The row is filled: up to 4 pages are 2 keys wide; with 5 to 7
    // the first pages are 2 wide and the rest 1 so that 8 keys are used (6 pages: DRIVER and GRIP wide, the other four narrow); 8 are all narrow.
    // PL-1: with more than 8 pages (a clip and a race log make 10) the row shows the first 7 and a PAGES key; PAGES opens a screen with every page.
    const all = a.pages || [], page = this.cur('page', a.page);
    if (all.length > WB_ROW && this.picker) return this.buildPicker(all, page);
    this.picker = false;
    const more = all.length > WB_ROW, pages = more ? all.slice(0, WB_ROW - 1) : all, wide = more ? 0 : Math.min(pages.length, 8 - pages.length);
    if (pages.length > 1) { let col = 0; pages.forEach((id, i) => { const w = i < wide ? 2 : 1; add(col, 3, w, 1, wbPageName(id), page === id ? 'SHOWING' : '', 'wb-page', id, page === id ? 'sel' : '', 2); col += w; }); }
    if (more) {
      const hiddenShowing = all.indexOf(page) >= WB_ROW - 1;       // the page on show is one of the pages behind the PAGES key: say which
      add(WB_ROW - 1, 3, 1, 1, 'PAGES', hiddenShowing ? wbPageName(page) : 'ALL ' + all.length, 'pages', null, hiddenShowing ? 'sel' : '', 2);
    }
    return R;
  }

  // every page as a big key (2 keys wide, 4 to a row, rows 2 to 4), BACK returns to the analysis keys
  buildPicker(all, page) {
    const R = [], add = (c, r, w, h, text, sub, act, arg, style, wrap) => R.push({ c, r, w, h, text, sub, act, arg, style: style || '', wrap: wrap || 0 });
    add(0, 0, 1, 1, 'BACK', 'TO ANALYSIS', 'pagesback', null, 'grey', 2);
    add(1, 0, 7, 1, 'PAGES', '', null, null, 'banner');
    const w = all.length <= 12 ? 2 : 1, per = 8 / w;
    all.slice(0, per * 3).forEach((id, i) => add((i % per) * w, 1 + Math.floor(i / per), w, 1, wbPageName(id), page === id ? 'SHOWING' : '', 'wb-page', id, page === id ? 'sel' : '', 2));
    return R;
  }
};

// ---------------- Sound screen ----------------
// Game sound without Windows' mixer (C-39). One column per sound: GAME (the sim), SPOTTER (CrewChief), MUSIC (Spotify), SPEAKERS (the speakers'
// own level), BUTTKICKER (its own level). Top key: the level, + and - below it, MUTE at the bottom (red while muted). RACE / CRUISE / NIGHT set them all
// at once. Windows' default output device and every other Windows setting are never changed. irdash /sound is what irdeck read from Windows; presses go
// to /api/do (snd...). A sound that is not playing right now has no level to set: its keys are dim and say so.
const SNDCOLORS = { sel: [GOLD, '#111'], go: [GREEN, '#03140a'], stop: ['#c62f2f', '#fff'], amber: ['#d98b2b', '#140b00'], grey: ['#2a2a2a', INK], banner: ['#0b0b0b', GOLD],
                    strip: ['#0b0b0b', INK], dim: ['#101010', '#55524c'], '': ['#1b1b1b', INK] };
const SND_IDS = ['sim', 'spotter', 'music', 'speakers', 'buttkicker'];
const SND_PRESETS = [['race', 'RACE', 'spotter up, no music'], ['cruise', 'CRUISE', 'music on, spotter low'], ['night', 'NIGHT', 'everything lower']];
const sndShort = n => { const m = /\((.*)\)/.exec(n || ''); return (m ? m[1] : (n || '')).toUpperCase(); };
const Sound = new class extends Screen {
  constructor() {
    super('sound', SNDCOLORS);
    this.s = null;                 // the last /sound
    this.local = {};               // what a press changed, shown until irdeck has done it: key -> { v, until }
    this.interval = 700;
  }
  hasState() { return !!this.s; }
  cur(k, serverValue) { const h = this.local[k]; return h && Date.now() < h.until ? h.v : serverValue; }
  hold(k, v) { this.local[k] = { v, until: Date.now() + 3000 }; }

  // the SOUND key on your own profile
  keyIcon(force) {
    if (!this.keys.size || (!force && this.keyShown)) return;
    const [c, g] = this.iconCanvas();
    g.fillStyle = GOLD; g.font = '600 28px ' + FONT; g.fillText('SOUND', 72, 68);
    g.fillStyle = INK; g.font = '400 22px ' + FONT; g.fillText('SCREEN', 72, 102);
    this.keyShown = '1'; this.setKeyImage(c.toDataURL('image/png'));
  }

  // while the opener key is on the deck: the last known state (a peek: irdash does not ask Windows for it)
  async keyTick() {
    if (!this.keys.size || this.live) return;
    try { this.s = await this.get('/sound?peek=1'); } catch (e) { this.s = { ready: false, off: true }; }
    this.keyIcon(false);
    this.warm();
  }

  async open(opts) {
    if (!deviceId) return;
    Perf.begin('sound');
    this.local = {};
    this.switchTo('RigSound'); Perf.mark('sound', 'switchSent');
    this.fastUntil = performance.now() + 2500;
    if (this.s) this.warm();
  }
  exit() { this.switchTo(''); }   // back to your own keys

  async poll() {
    try { this.s = await this.get('/sound'); } catch (e) { this.s = { ready: false, off: true }; }
    this.relayout();
  }

  async act(r) {
    if (r.act === 'exit') { this.exit(); return; }
    const s = this.s, items = s.items || [];
    if (r.act === 'sndvol') {
      const p = String(r.arg).split(':'), it = items.find(x => x.id === p[0]);
      if (it) this.hold(p[0] + '.vol', Math.max(0, Math.min(100, this.cur(p[0] + '.vol', it.vol) + parseInt(p[1], 10))));
    }
    if (r.act === 'sndmute') { const it = items.find(x => x.id === r.arg); if (it) this.hold(r.arg + '.mute', !this.cur(r.arg + '.mute', it.mute)); }
    this.relayout();
    await this.cmd(r.act, r.arg);
    await this.refreshSoon(700);
  }

  // the top key of a column: name, level as a number and a bar; MUTED in red; "NOT PLAYING" when there is nothing to set
  paintLevel(x, px, py, pw, ph, it, vol, mute) {
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = GOLD; x.font = '600 14px ' + FONT; x.fillText(it.name, px + pw / 2, py + 13);
    if (!it.live) {
      x.fillStyle = '#6d6a63'; x.font = '600 16px ' + FONT;
      x.fillText('NOT', px + pw / 2, py + 40); x.fillText(it.kind === 'device' ? 'FOUND' : 'PLAYING', px + pw / 2, py + 60);
      return;
    }
    x.fillStyle = mute ? '#6d6a63' : INK; x.font = '600 32px ' + FONT; x.fillText(vol + '%', px + pw / 2, py + 42);
    if (mute) { x.fillStyle = '#ff6b6b'; x.font = '600 14px ' + FONT; x.fillText('MUTED', px + pw / 2, py + 64); }
    const bx = px + 8, bw = pw - 16, by = py + ph - 14;
    x.fillStyle = '#2a2a2a'; x.fillRect(bx, by, bw, 7);
    x.fillStyle = mute ? '#6d6a63' : GOLD; x.fillRect(bx, by, bw * Math.max(0, Math.min(100, vol)) / 100, 7);
  }

  build() {
    const s = this.s, R = [];
    const add = (c, r, w, h, text, sub, act, arg, style, wrap, more) => { const o = { c, r, w, h, text, sub, act, arg, style: style || '', wrap: wrap || 0 }; if (more) Object.assign(o, more); R.push(o); };
    if (!s.ready) {
      add(0, 0, 8, 3, 'SOUND NOT READY', s.off ? 'Needs the dashboard update' : 'Reading sound devices', null, null, 'amber', 2, { size: 38 });
      add(7, 3, 1, 1, 'EXIT', 'SOUND', 'exit', null, 'stop');
      return R;
    }
    const items = {}; (s.items || []).forEach(it => { items[it.id] = it; });
    SND_IDS.forEach((id, c) => {
      const it = items[id] || { id, name: id.toUpperCase(), kind: 'app', live: false, vol: 0, mute: false };
      const live = it.live, vol = this.cur(id + '.vol', it.vol), mute = this.cur(id + '.mute', it.mute);
      add(c, 0, 1, 1, '', '', null, null, 'strip', 0, { extra: JSON.stringify([it.name, live, vol, mute]), noflash: true, paint: (x, px, py, pw, ph) => this.paintLevel(x, px, py, pw, ph, it, vol, mute) });
      add(c, 1, 1, 1, '+', it.name, live ? 'sndvol' : null, id + ':+10', live ? '' : 'dim', 0, { size: 44 });
      add(c, 2, 1, 1, '−', it.name, live ? 'sndvol' : null, id + ':-10', live ? '' : 'dim', 0, { size: 44 });
      add(c, 3, 1, 1, mute ? 'MUTED' : 'MUTE', '', live ? 'sndmute' : null, id, live ? (mute ? 'stop' : 'grey') : 'dim', 2, { once: true });
    });
    add(5, 0, 3, 1, 'SOUND', s.using ? 'PLAYING ON ' + sndShort(s.using) : 'no output device found', null, null, 'banner', 2);
    SND_PRESETS.forEach((p, i) => add(5 + i, 1, 1, 1, p[1], p[2], 'sndpreset', p[0], s.preset === p[0] ? 'sel' : '', 2));
    if (s.default && s.default !== s.using) add(5, 2, 3, 1, 'WINDOWS DEFAULT', sndShort(s.default), null, null, 'dim', 2);
    add(7, 3, 1, 1, 'EXIT', 'SOUND', 'exit', null, 'stop');
    return R;
  }
};

// The deck key presses and the profile tiles belong to one of the live screens (by action / by the tile's settings.p).
const SCREENS = { friends: Friends, overlays: Overlays, mydrive: MyDrive, replay: Replay, analysis: Analysis, sound: Sound };

// ---------------- speed test (tests\deck-speed-test.ps1 -Live) ----------------
// irdash's /mydrive says "run a test": open that screen once, time it (perf lines in the log), and go back. Nothing is changed.
async function speedTest(which) {
  const s = SCREENS[which];
  if (!s || !deviceId || playing || s.live) return;
  log('speedtest: opening ' + which + ' (a test; nothing is changed)');
  await s.open({ test: true });
  await sleep(6000);
  s.exit({ test: true });
}

function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info) {
  pluginUUID = uuid;
  try { const i = JSON.parse(info); const xl = (i.devices || []).find(d => d.type === 2) || (i.devices || [])[0]; if (xl) deviceId = xl.id; } catch (e) { }
  ws = new WebSocket('ws://127.0.0.1:' + port);
  ws.onopen = () => { send({ event: registerEvent, uuid }); pollLoop(); };
  ws.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.event === 'deviceDidConnect' && (!deviceId || (e.deviceInfo && e.deviceInfo.type === 2))) deviceId = e.device;
    const keyScreen = Object.values(SCREENS).find(s => e.action === UUID + '.' + s.name);                 // a screen's opener key on your profile
    const p = e.payload && e.payload.settings && e.payload.settings.p;
    const tileScreen = !keyScreen && p && SCREENS[p];                                                     // a key of a screen's profile
    const action = e.action && e.action.indexOf(UUID + '.') === 0 ? e.action.slice((UUID + '.').length) : '';
    const stateKey = stateKeys[action] ? action : null;
    const isDocKey = e.action === UUID + '.doctor';
    const pos = e.payload && e.payload.coordinates ? e.payload.coordinates.column + ',' + e.payload.coordinates.row : '';
    if (e.event === 'willAppear') {
      if (keyScreen) { keyScreen.keys.add(e.context); keyScreen.keyPos[e.context] = pos; keyScreen.keyIcon(true); }
      else if (stateKey) { stateKeys[stateKey].add(e.context); paintStateKey(e.context, stateKey); pollDeckState(); }
      else if (tileScreen) tileScreen.appear(pos, e.context);
      else if (isDocKey) { docKeys.add(e.context); RigDoctor.icon(true); }
      else if (pos) { tiles[pos] = e.context; send({ event: 'setImage', context: e.context, payload: { image: blank(), target: 0 } }); }
    }
    if (e.event === 'willDisappear') {
      if (keyScreen) { keyScreen.keys.delete(e.context); delete keyScreen.keyPos[e.context]; }
      else if (stateKey) stateKeys[stateKey].delete(e.context);
      else if (tileScreen) tileScreen.disappear(pos);
      else if (isDocKey) docKeys.delete(e.context);
      else if (pos) delete tiles[pos];
    }
    if (e.event === 'keyDown') {
      if (keyScreen) keyScreen.open();
      else if (stateKey) { /* image only; the MAIN action remains owned by irdeck */ }
      else if (tileScreen) tileScreen.press(e.payload.coordinates.column, e.payload.coordinates.row);
      else if (isDocKey) RigDoctor.press();
      else { playing = true; back(); }   // any key during (or, by any chance, after) the intro returns to your buttons
    }
  };
}

// Asks irdash every 2 s whether to play the intro (and keeps the screens' last state ready for the moment a key opens one).
async function pollLoop() {
  later(0, async function stateLoop() { while (true) { if (Object.values(stateKeys).some(x => x.size)) await pollDeckState(); await sleep(1000); } });
  for (;;) {
    try { await poll(); } catch (e) { }
    try { await Overlays.keyTick(); } catch (e) { }
    try { await Friends.keyTick(); } catch (e) { }
    try { await MyDrive.keyTick(); } catch (e) { }
    try { await Replay.keyTick(); } catch (e) { }
    try { await Analysis.keyTick(); } catch (e) { }
    try { await Sound.keyTick(); } catch (e) { }
    try { await RigDoctor.tick(); } catch (e) { }
    await sleep(2000);
  }
}

async function poll() {
  if (playing) return;
  let s;
  try { s = await (await fetch(API + '/showcase?who=deck', { cache: 'no-store' })).json(); }
  catch (e) { if (!poll.warned) { poll.warned = true; log('irdash not reachable yet: ' + e); } return; }
  if (!poll.ok) { poll.ok = true; log('connected to irdash, seq ' + s.seq + (s.play ? ', boot play' : '')); }
  const replay = seq !== null && s.seq > seq && !s.driving;
  seq = s.seq;
  if (s.play || replay) play();
}

let blankUrl = null;
function blank() { if (!blankUrl) { const c = document.createElement('canvas'); c.width = c.height = PX; const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, PX, PX); blankUrl = c.toDataURL('image/png'); } return blankUrl; }

async function play() {
  if (playing) return;
  if (!deviceId) { log('no Stream Deck XL found'); return; }
  playing = true;
  const guard = { off: false };
  later(15000, () => { if (!guard.off) back(); });   // never leave the deck on the intro
  try {
    log('playing on ' + deviceId);
    send({ event: 'switchToProfile', context: pluginUUID, device: deviceId, payload: { profile: 'RigIntro' } });
    for (let i = 0; i < 30 && Object.keys(tiles).length < COLS * ROWS; i++) await sleep(100);
    log(Object.keys(tiles).length + ' tiles appeared');
    if (Object.keys(tiles).length === 0) return;
    const big = document.createElement('canvas'); big.width = W; big.height = H;
    const g = big.getContext('2d');
    const tile = document.createElement('canvas'); tile.width = tile.height = PX;
    const tg = tile.getContext('2d');
    // time-based, so a slow frame skips ahead instead of stretching the sequence
    const start = performance.now(), length = 7.2;
    for (let t = 0; t < length; t = (performance.now() - start) / 1000) {
      draw(g, t);
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const ctx = tiles[c + ',' + r]; if (!ctx) continue;
        tg.drawImage(big, c * PX, r * PX, PX, PX, 0, 0, PX, PX);
        send({ event: 'setImage', context: ctx, payload: { image: tile.toDataURL('image/png'), target: 0 } });
      }
      await tick();
    }
    log('sequence done in ' + ((performance.now() - start) / 1000).toFixed(1) + ' s');
  } catch (e) { }
  finally { guard.off = true; back(); }
}

function back() {
  if (!playing) return;
  playing = false;
  send({ event: 'switchToProfile', context: pluginUUID, device: deviceId, payload: {} });   // no name = the previous profile
  log('back to the buttons');
}

const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const fmtTime = t => { t = +t; const m = Math.floor(t / 60), s = t - m * 60; return (m ? m + ':' + (s < 10 ? '0' : '') : '') + s.toFixed(3); };

// The sequence, in seconds: gold hairline, driver card (4 / PETER), the green flag waves across, settle, fade.
function draw(g, t) {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  // 0.0-1.0 hairline draws left to right through the middle
  const hw = ease(t / 1.0) * W;
  // 0.8-3.4 driver card
  const card = t < 0.8 ? 0 : t < 3.6 ? ease((t - 0.8) / 0.8) : Math.max(0, 1 - (t - 3.6) / 0.5);
  if (card > 0) {
    g.save(); g.globalAlpha = card;
    g.strokeStyle = GOLD; g.lineWidth = 3;
    g.font = '300 330px ' + FONT; g.textBaseline = 'alphabetic';
    g.strokeText('4', 22, H - 22);
    g.fillStyle = GOLD; g.font = '600 26px ' + FONT;
    g.fillText('D R I V E R', 230, 150);
    g.fillStyle = INK; g.font = '600 118px ' + FONT;
    g.fillText('PETER', 222, 270);
    g.restore();
  }
  if (t < 4.0) {
    g.fillStyle = GOLD; g.globalAlpha = t < 3.6 ? 1 : Math.max(0, 1 - (t - 3.6) / 0.4);
    g.fillRect(0, 292, hw, 2); g.globalAlpha = 1;   // the rule under the name, as on the top screen
  }
  // 3.8-6.4 the green flag: sweeps in from the left and ripples like cloth
  if (t > 3.8) {
    const p = ease((t - 3.8) / 0.9), edge = p * (W + 200) - 100;
    const fade = t > 6.4 ? Math.max(0, 1 - (t - 6.4) / 0.7) : 1;
    for (let x = 0; x < W; x += 4) {
      if (x > edge) break;
      const wave = Math.sin(x / 70 - t * 7) * 0.5 + 0.5;
      const light = 0.55 + 0.45 * wave;
      const r = Math.round(31 * light), gr = Math.round(191 * light), b = Math.round(95 * light);
      g.fillStyle = 'rgba(' + r + ',' + gr + ',' + b + ',' + fade + ')';
      const sag = Math.sin(x / 90 - t * 7) * 10 * (x / W);
      g.fillRect(x, sag, 4, H);
    }
    if (t > 4.8 && t < 6.6) {
      g.globalAlpha = Math.min(1, (t - 4.8) / 0.4) * fade;
      g.fillStyle = '#04150a'; g.font = '700 74px ' + FONT; g.textAlign = 'center';
      g.fillText('G R E E N', W / 2, H / 2 + 26); g.textAlign = 'left'; g.globalAlpha = 1;
    }
  }
}
