<!doctype html>
<html>
<head><meta charset="utf-8"><title>Paddock</title></head>
<body>
<!-- W3-4: the one key drawing and colour table (deck\keyart.js) and the deck layout (deck\layout.json as layout.js); install.ps1 puts both next to this page -->
<script src="keyart.js"></script>
<script src="layout.js"></script>
<script>
'use strict';
// Paddock add-on (folder and UUID keep the old name "rigintro"): the startup flag sequence across all 32 keys, and the live
// screens drawn on the deck: FRIENDS mode, OVERLAYS, AI RACE, REPLAY, SOUND, AC, RACES, CONFIRM (each a bundled one-page profile whose 32 tiles this page paints).
// irdash decides when the intro plays (its showcase answer, in http://localhost:8199/deck/summary since W0-5): once per Windows start, again whenever
// the SHOWCASE key / "Play intro" bumps seq, never while driving. Switches to the bundled RigIntro profile,
// animates its 32 tiles, then switches back to the profile that was showing before.
//
// SPEED (2026-10-09): this page is a hidden background page. The browser slows its setTimeout/setInterval to about
// once a second there, and to once a minute after five minutes hidden. So NOTHING here uses setTimeout or setInterval:
// every wait goes through sleep()/later(), which run on a worker's timer (not slowed). Screens are drawn at once from
// the last state they know (the FRIENDS / OVERLAYS / MY DRIVE keys fetch it before the profile switches), a picture is
// only drawn and PNG-encoded once per distinct look (cache), and only keys whose picture changed are sent.
// Timing lines ("perf ...") go to the plugin log: %APPDATA%\Elgato\StreamDeck\logs\com.peter.rigintro0.log.
const COLS = 8, ROWS = 4, PX = 96, W = COLS * PX, H = ROWS * PX, FPS = 12;
// every colour comes from keyart.js (one table for the deck pictures and every screen; W3-4)
const C = KEYART.C, STYLE = KEYART.STYLE;
const GOLD = C.gold, INK = C.ink, GREEN = C.green;
const UUID = 'com.peter.rigintro';
const API = 'http://localhost:8199';
const PADDOCK_SECRET = '1';     // W0-2: deck-intro\install.ps1 puts the add-on's own secret here in the installed copy; sent as X-Paddock
const FONT = KEYART.FONT;
// the deck layout (deck\layout.json): the words and glyphs of the opener keys, and where EXIT sits on every screen (7,3)
const DECK = window.DECK_LAYOUT || null;
const EXIT_AT = KEYART.exitAt(DECK);
// the one EXIT key of every screen: same place, same red, same word, drawn by the same function as the deck pictures
// W3-4 review: for 0.8 s after the deck changes page, presses are ignored (a doubled press used to land on the new page's key in the same
// spot: SOUND -> MUTE, OVERLAYS -> MOVE, FRIENDS -> a driver, EXIT -> RIG ...). Every page change goes through Screen.switchTo or back().
const SWITCH_DEAF_MS = 800;
let switchedAt = -1e9;
const deafNow = () => performance.now() - switchedAt < SWITCH_DEAF_MS;
function exitRegion() { return { c: EXIT_AT[0], r: EXIT_AT[1], w: 1, h: 1, text: 'EXIT', sub: '', act: 'exit', arg: null, style: 'stop', wrap: 0, key: KEYART.EXIT }; }
let ws = null, pluginUUID = '', deviceId = '', seq = null, playing = false;
const tiles = {};               // intro profile: "col,row" -> context
const docKeys = new Set();      // the RIG DOCTOR key(s), if you put one on a profile
// Keys that FLIP something (on/off, play/pause). A press that reaches the add-on twice must not flip it back, so Screen.press() ignores a
// second press of the same key within 0.7 s. Only a few keys carried "once: true"; the rest were missing (2026-10-18 audit).
const ONCE_ACTS = new Set(['ovtoggle', 'deltaon', 'mddamage', 'mdstar', 'line', 'coach', 'board', 'rpplay', 'rphideui', 'rpautotv']);

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function log(m) { send({ event: 'logMessage', payload: { message: 'rigintro: ' + m } }); }   // lands in the plugin log

// ---------------- timers: the worker's, never the page's ----------------
const timerWorker = (() => { try { return new Worker(URL.createObjectURL(new Blob(['onmessage = e => setTimeout(() => postMessage(e.data.id), e.data.ms);'], { type: 'text/javascript' }))); } catch (e) { return null; } })();
const waiting = new Map(); let timerId = 1;
if (timerWorker) timerWorker.onmessage = e => { const f = waiting.get(e.data); if (f) { waiting.delete(e.data); f(); } };
const sleep = ms => new Promise(r => { if (!timerWorker) { setTimeout(r, ms); return; } const id = timerId++; waiting.set(id, r); timerWorker.postMessage({ id, ms }); });
const later = (ms, f) => { sleep(ms).then(f); };
const tick = () => sleep(1000 / FPS);

// ---------------- talking to irdash: every request gives up after 2 s ----------------
// An irdash that accepts the connection and never answers used to freeze the whole add-on: no fetch had a timeout, so the
// opener keys and an open screen stopped for good (audit 11, A2). The abort runs on the worker's timer like every other wait.
const FETCH_MS = 2000;
function fetchT(url, ms, headers) {
  const ctl = new AbortController();
  later(ms || FETCH_MS, () => ctl.abort());
  const o = { cache: 'no-store', signal: ctl.signal }; if (headers) o.headers = headers;
  return fetch(url, o).then(r => { Health.lastOk = performance.now(); return r; });
}
// every command to irdash (it changes something) goes through here: the 2 s timeout and X-Paddock with the add-on's secret (W0-2)
function sendCmd(path) {
  return fetchT(API + path, 0, { 'X-Paddock': PADDOCK_SECRET });
}

// Is irdash answering? One "tick" = one /deck/summary pass (every 5 s). After 3 ticks in a row with no answer the opener keys go grey
// (they would otherwise keep showing an old state as if it were true: A3); the first good answer brings them back.
const Health = {
  lastOk: 0, failed: 0, grey: false,
  tick(ok) {
    if (ok) { this.failed = 0; if (this.grey) { this.grey = false; this.repaint(); } return; }
    this.failed++;
    if (this.failed >= 3 && !this.grey) { this.grey = true; this.paintGrey(); }
  },
  // the opener key's own picture, greyed: its glyph and words dim, NOT ANSWERING under them (the key language of keyart.js)
  greyPic(word, sub, spec) {
    const base = spec || { label: String(word).split(' ').slice(0, 2), glyph: '' };
    return KEYART.keyPng(Object.assign({}, base, { role: 'dead', note: sub, noteColor: 'faint', dot: null }));
  },
  paintGrey() {
    log('irdash not answering: opener keys grey');
    for (const s of Object.values(SCREENS)) for (const ctx of s.keys) send({ event: 'setImage', context: ctx, payload: { image: this.greyPic(s.greyWord(ctx), 'NOT ANSWERING', s.openerSpec(ctx)), target: 0 } });
    for (const ctx of docKeys) send({ event: 'setImage', context: ctx, payload: { image: this.greyPic('RIG DOCTOR', 'NOT ANSWERING', RigDoctor.spec), target: 0 } });
  },
  repaint() {
    log('irdash answering again: opener keys back');
    for (const s of Object.values(SCREENS)) { s.keyShown = ''; try { s.keyIcon(true); } catch (e) { } }
    try { RigDoctor.icon(true); } catch (e) { }
  },
};

// ---------------- timing of a screen opening (key press -> pictures on the keys) ----------------
const Perf = {
  cur: null,
  begin(name) { const c = this.cur = { name, t0: performance.now(), marks: {}, cached: 0, drawn: 0 }; later(4000, () => { if (this.cur === c) this.finish(); }); },
  mark(name, k) { const c = this.cur; if (c && c.name === name && !(k in c.marks)) c.marks[k] = Math.round(performance.now() - c.t0); },
  count(name, fromCache) { const c = this.cur; if (c && c.name === name) { if (fromCache) c.cached++; else c.drawn++; } },
  finish() {
    const c = this.cur; if (!c) return; this.cur = null;
    const m = c.marks, t = k => (k in m ? m[k] + ' ms' : 'not reached');
    log('perf ' + c.name + ' open: press -> profile switch sent ' + t('switchSent') + ', first key appeared ' + t('firstTile') + ', first picture sent ' + t('firstPicture') + ', all 32 pictures sent ' + t('allPictures') + ' (' + c.cached + ' pictures from the cache, ' + c.drawn + ' drawn on demand)');
  },
};

// ---------------- a live screen: 32 keys painted from a list of regions ----------------
// A region is { c, r, w, h, text, sub, act, arg, style, wrap }: the rectangle of keys it covers, what it says and does.
// Every key has a "look" string (its region's text/style plus its place); the PNG for a look is made once and kept.
class Screen {
  constructor(name) {
    this.name = name;
    this.keys = new Set();            // the screen's own opener key(s) on your profile
    this.tiles = {};                  // "col,row" -> context, for the keys that are on the deck right now
    this.shown = {};                  // "col,row" -> the look that is on that key now
    this.regions = []; this.looks = {};
    this.pics = new Map();            // look -> PNG data URL
    this.canvas = null; this.tileCv = null; this.dirty = true;
    this.pressedKey = null; this.fastUntil = 0; this.looping = false; this.interval = 700; this.sent = 0;
    this.keyShown = '';
    this.keyPos = {};                 // opener key context -> "col,row" (two keys can open one screen: MY DRIVE and CAR TRACK)
    this.offline = false;             // irdash stopped answering while this screen was open (run() / showOffline())
    this.onceAt = {};                 // key -> when it was last pressed, for keys marked once (toggles)
    this.keySettings = {};            // opener key context -> its settings (the CONFIRM key says what it confirms)
  }
  get live() { return Object.keys(this.tiles).length > 0; }
  hasState() { return false; }        // is there anything to draw yet
  build() { return []; }              // the regions for the current state
  gsig() { return ''; }               // anything that changes every key at once (a full-screen flash)
  paintOver(x) { }                    // drawn over the keys
  async poll() { }                    // fetch the state and relayout()
  async act(r) { }                    // what a press on region r does
  keyIcon(force) { }                  // the opener key's picture

  setKeyImage(url) { for (const ctx of this.keys) send({ event: 'setImage', context: ctx, payload: { image: url, target: 0 } }); }
  // the opener key as deck\layout.json says it (label, glyph, role): the same picture build-deck.ps1 put on the key, drawn by keyart.js
  openerSpec(ctx) {
    const s = (ctx && this.keySettings[ctx]) || {};
    return KEYART.openerSpec(DECK, this.name, s.what) || { label: [this.name.toUpperCase()], glyph: '', role: 'white' };
  }
  greyWord(ctx) { return (this.openerSpec(ctx).label || [this.name.toUpperCase()]).join(' '); }   // the opener key's word while irdash is not answering (Health)
  // paint the opener key(s): the layout's picture plus one small live line (how many are on, the room temperature ...)
  paintOpener(note, noteColor, extra) {
    for (const ctx of this.keys) send({ event: 'setImage', context: ctx, payload: { image: KEYART.keyPng(Object.assign({}, this.openerSpec(ctx), { note: note || '', noteColor: noteColor || '' }, extra || {})), target: 0 } });
  }

  // a key of this screen's profile appeared / went away
  appear(pos, ctx) {
    this.tiles[pos] = ctx; delete this.shown[pos];
    Perf.mark(this.name, 'firstTile');
    if (this.hasState()) { if (this.looks[pos]) this.sendTile(pos); else this.relayout(); }
    if (!this.looping) this.run();
  }
  disappear(pos) { delete this.tiles[pos]; delete this.shown[pos]; }

  // work out what every key should look like; send the keys that are on the deck and differ from what they show
  relayout() {
    if (!this.hasState()) return;
    this.regions = this.build();
    const at = {}, g = this.gsig();
    for (const r of this.regions) for (let dy = 0; dy < r.h; dy++) for (let dx = 0; dx < r.w; dx++) at[(r.c + dx) + ',' + (r.r + dy)] = r;
    this.looks = {};
    for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
      const pos = col + ',' + row, r = at[pos];
      // extra / size / strip: a screen's own drawing (REPLAY's timeline), a bigger label, a class colour on the key's edge
      this.looks[pos] = (r ? [r.c, r.r, r.w, r.h, r.text, r.sub, r.style, r.wrap || '', r.single ? 'N' : '', this.pressedKey === r.c + ',' + r.r && !r.noflash ? 'P' : '', r.extra || '', r.size || '', r.strip || ''].join('|') : 'blank') + '|' + g + '@' + pos;
    }
    this.dirty = true;
    for (const pos in this.tiles) this.sendTile(pos);
  }

  // make the pictures for the current look of all 32 keys now (while the deck is still loading the page)
  warm() {
    this.relayout();
    for (const pos in this.looks) if (!this.pics.has(this.looks[pos])) this.pics.set(this.looks[pos], this.encode(pos));
  }

  sendTile(pos) {
    const ctx = this.tiles[pos], look = this.looks[pos];
    if (!ctx || !look || this.shown[pos] === look) return;
    let url = this.pics.get(look);
    Perf.count(this.name, !!url);
    if (!url) {
      url = this.encode(pos); this.pics.set(look, url);
      if (this.pics.size > 400) { const keep = new Map(); for (const k of Object.values(this.looks)) if (this.pics.has(k)) keep.set(k, this.pics.get(k)); this.pics = keep; }
    }
    send({ event: 'setImage', context: ctx, payload: { image: url, target: 0 } });
    this.shown[pos] = look; this.sent++;
    Perf.mark(this.name, 'firstPicture');
    if (Object.keys(this.shown).length === COLS * ROWS) { Perf.mark(this.name, 'allPictures'); if (Perf.cur && Perf.cur.name === this.name) Perf.finish(); }
  }

  encode(pos) {
    if (this.dirty) { this.drawCanvas(); this.dirty = false; }
    const [col, row] = pos.split(',').map(Number);
    const tg = this.tileCv.getContext('2d');
    // a key-language key (EXIT): drawn straight onto the key by keyart.js, so it is the same picture deck\render.html makes for that spec
    const r = this.regionAt(col, row);
    if (r && r.key && r.w === 1 && r.h === 1 && !this.gsig()) { KEYART.drawKey(tg, 0, 0, PX, this.keySpec(r)); return this.tileCv.toDataURL('image/png'); }
    tg.drawImage(this.canvas, col * PX, row * PX, PX, PX, 0, 0, PX, PX);
    return this.tileCv.toDataURL('image/png');
  }
  keySpec(r) { return this.pressedKey === r.c + ',' + r.r && !r.noflash ? Object.assign({}, r.key, { pressed: true }) : r.key; }

  // every tile is drawn by keyart.js (drawRegion: the screens' text tiles; drawKey: the key-language keys such as EXIT), from its one colour table
  drawCanvas() {
    if (!this.canvas) { this.canvas = document.createElement('canvas'); this.canvas.width = W; this.canvas.height = H; this.tileCv = document.createElement('canvas'); this.tileCv.width = this.tileCv.height = PX; }
    const x = this.canvas.getContext('2d');
    x.fillStyle = C.black; x.fillRect(0, 0, W, H);
    for (const r of this.regions) {
      if (r.key && r.w === 1 && r.h === 1) { KEYART.drawKey(x, r.c * PX, r.r * PX, PX, this.keySpec(r)); continue; }
      KEYART.drawRegion(x, r, r.c * PX + 3, r.r * PX + 3, r.w * PX - 6, r.h * PX - 6, this.pressedKey === r.c + ',' + r.r && !r.noflash);
    }
    this.paintOver(x);
  }

  lines(x, text, maxW) { return KEYART.textLines(x, text, maxW); }

  // keep the state fresh while the screen is on the deck. A press makes it look faster for a few seconds.
  async run() {
    this.looping = true; this.offline = false;
    const t0 = performance.now(), sent0 = this.sent; let polls = 0, bad = 0, threw = false, answeredAt = performance.now();
    while (this.live) {
      const t = performance.now();
      // A poll that throws (irdash down) or leaves the screen with no state used to change nothing: the keys froze on the last picture,
      // or stayed black from the start, and a press only wrote "irdash not reachable" to a log. After 4 in a row the keys say so.
      // get() notes a failed request on the screen (lastFail): SOUND, AC, AI LEVEL and RACES catch it themselves and draw a state of
      // their own, which used to hide a hung irdash behind "NOT READY"
      this.lastFail = false;
      this.inPoll = true;
      try { await this.poll(); polls++; threw = this.lastFail; bad = this.hasState() ? 0 : bad + 1; } catch (e) { bad++; threw = true; }
      this.inPoll = false;
      if (!threw) answeredAt = performance.now();
      // a hung irdash: each poll now gives up after 2 s (fetchT), so the message shows within about 2 s of the screen opening
      const down = bad >= 4 || (threw && performance.now() - answeredAt >= 1900);
      if (down && !this.offline) { this.offline = true; this.showOffline(); }
      else if (bad === 0 && !threw && this.offline) { this.offline = false; this.relayout(); }
      else if (down && this.offline) this.showOffline();    // new tiles may have appeared (shown[] was cleared by appear())
      await sleep(Math.max(40, (performance.now() < this.fastUntil ? 220 : this.interval) - (performance.now() - t)));
    }
    this.looping = false;
    const secs = (performance.now() - t0) / 1000;
    log('perf ' + this.name + ' screen closed: ' + polls + ' refreshes in ' + secs.toFixed(1) + ' s (one every ' + (polls ? (secs / polls).toFixed(2) : '-') + ' s), ' + (this.sent - sent0) + ' key pictures sent');
  }

  // irdash is not answering: one message across all 32 keys, EXIT on the bottom-right key (press() lets only that one through)
  showOffline() {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = C.black; x.fillRect(0, 0, W, H);
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = C.amber;
    x.font = '600 52px ' + FONT; x.fillText('DASHBOARD NOT ANSWERING', W / 2, 130, W - 40);
    x.fillStyle = INK; x.font = '400 30px ' + FONT; x.fillText('Wait a moment, this clears on its own.', W / 2, 205, W - 40);
    KEYART.drawKey(x, EXIT_AT[0] * PX, EXIT_AT[1] * PX, PX, KEYART.EXIT);   // the same EXIT as on every screen
    const t = document.createElement('canvas'); t.width = t.height = PX; const tg = t.getContext('2d');
    for (const pos in this.tiles) {
      if (this.shown[pos] === 'offline') continue;
      const [col, row] = pos.split(',').map(Number);
      tg.drawImage(c, col * PX, row * PX, PX, PX, 0, 0, PX, PX);
      send({ event: 'setImage', context: this.tiles[pos], payload: { image: t.toDataURL('image/png'), target: 0 } });
      this.shown[pos] = 'offline';
    }
  }

  regionAt(col, row) { return this.regions.find(x => col >= x.c && col < x.c + x.w && row >= x.r && row < x.r + x.h); }

  async press(col, row) {
    // the deck just changed page: a press arriving 2-3 times (29 ms - 1 s apart) must not land on the key now in the same place
    if (deafNow()) { log(this.name + ': press ignored (the deck changed page ' + Math.round(performance.now() - switchedAt) + ' ms ago)'); return; }
    // irdash is not answering (see run()): the keys say so; the bottom-right key still leaves the screen so nobody is stuck on it
    if (this.offline) { if (col === EXIT_AT[0] && row === EXIT_AT[1]) this.exit(); return; }
    const r = this.regionAt(col, row);
    if (!r || !r.act) return;
    // one press can reach the add-on two or three times within a fraction of a second: a toggle (mute, play, tile ...) must not flip back.
    // Only some keys were marked once; a doubled press on the others (OVERLAYS toggle, DELTA BAR, PLAY/PAUSE, SPEED, MAP COLOUR, VS ...)
    // sent the command twice = no change, or two steps of a cycle. ONCE_ACTS lists every toggle and cycle (see the list at the top).
    if (r.once || ONCE_ACTS.has(r.act)) { const k = r.c + ',' + r.r, now = performance.now(); if (this.onceAt[k] && now - this.onceAt[k] < 700) return; this.onceAt[k] = now; }
    this.pressedKey = r.c + ',' + r.r; this.relayout();                       // shows the press at once
    later(300, () => { this.pressedKey = null; this.relayout(); });
    this.fastUntil = performance.now() + 3000;
    await this.act(r, col, row);                                              // col / row: which key of a wide region was pressed
  }

  async refreshSoon(ms) { await sleep(ms); try { await this.poll(); } catch (e) { } }   // after a press: look again when irdeck has had time to act
  // a request that got no answer at all (refused, or the 2 s timeout) marks the screen; a bad body does not (that is not a hung irdash)
  // inside one poll, once a request got no answer the next ones are not tried (ANALYSIS asks two routes: 2 x 2 s)
  async get(path) { if (this.inPoll && this.lastFail) throw new Error('irdash not answering'); let r; try { r = await fetchT(API + path); } catch (e) { this.lastFail = true; throw e; } return await r.json(); }
  async cmd(c, a, base) {
    try { await sendCmd((base || '/api/do') + '?c=' + encodeURIComponent(c) + (a ? '&a=' + encodeURIComponent(a) : '')); }
    catch (e) { log(this.name + ': irdash not reachable'); }
  }
  switchTo(profile) { switchedAt = performance.now(); send({ event: 'switchToProfile', context: pluginUUID, device: deviceId, payload: profile ? { profile } : {} }); }   // no name = your own keys
}

// ---------------- Friends mode screen ----------------
// One live screen on the deck, drawn here: your choices light up gold. Out of the car: WHO / CAR / TRACK rows,
// wheel strength and a big START. In the car (a session is running) it switches by itself to a few large keys:
// RESET CAR, NEXT DRIVER, GET OUT. EXIT puts everything back and returns to your own keys.
// Every press goes to irdash (/api/guest/do), which runs the matching irdeck command.
// (colours: KEYART.STYLE, the one table; on/off toggles stay dark so gold means 'chosen')
const Friends = new class extends Screen {
  constructor() {
    super('friends');
    this.g = null;
    this.step = 'who';    // the step that glows: who -> car -> track -> start
    this.kb = null;       // the name being typed on the deck keyboard, or null
    this.local = {};      // what a press changed, shown until irdash confirms: key -> { v, until }
    this.flash = null; this.flashUntil = 0; this.lastEv = undefined;
  }
  hasState() { return !!this.g; }
  get blink() { return Math.floor(Date.now() / 700) % 2 === 0; }
  cur(k, serverValue) { const h = this.local[k]; return h && Date.now() < h.until ? h.v : serverValue; }
  hold(k, v) { this.local[k] = { v, until: Date.now() + 3000 }; }
  gsig() { return this.flash && Date.now() < this.flashUntil ? 'F' + this.flash.kind + this.blink : ''; }

  keyIcon(force) {
    if (!this.keys.size || (!force && this.keyShown)) return;
    this.keyShown = '1'; this.paintOpener();
  }

  // the opener key on your profile: keeps the last state at hand, so the screen can be drawn the moment it opens
  async keyTick(sum) {
    if (!this.keys.size || this.live || !sum.guest) return;
    this.g = sum.guest;
    this.warm();
  }

  async open(opts) {
    if (!deviceId) return;
    Perf.begin('friends');
    this.step = 'who'; this.kb = null;
    this.switchTo('RigFriends'); Perf.mark('friends', 'switchSent');
    this.fastUntil = performance.now() + 2500;
    if (!(opts && opts.test)) this.cmd('on', '', '/api/guest/do');   // not waited for: the page does not need it
    if (this.g) this.warm();                                         // pictures from the last known state while the deck loads the page
  }
  exit(opts) {
    if (!(opts && opts.test)) this.cmd('off', '', '/api/guest/do');
    this.switchTo('');
  }

  async poll() {
    this.g = await this.get('/guest');
    // a new record or personal best: the whole deck flashes gold for a few seconds
    const ev = this.g.event;
    if (ev && ev.id !== this.lastEv && this.lastEv !== undefined && (ev.kind === 'record' || ev.kind === 'pb')) { this.flashUntil = Date.now() + 3500; this.flash = ev; }
    if (ev || this.lastEv === undefined) this.lastEv = ev ? ev.id : null;
    this.relayout();
  }

  draft() { sendCmd('/api/guest/draft' + (this.kb == null ? '' : '?n=' + encodeURIComponent(this.kb))).catch(() => { }); }

  async act(r) {
    // the name keyboard is handled right here, so typing is instant
    if (r.act === 'letter') { if (this.kb.length < 14) this.kb += r.arg; this.draft(); this.relayout(); return; }
    if (r.act === 'space') { if (this.kb.length && !this.kb.endsWith(' ')) this.kb += ' '; this.draft(); this.relayout(); return; }
    if (r.act === 'bksp') { this.kb = this.kb.slice(0, -1); this.draft(); this.relayout(); return; }
    if (r.act === 'newdriver') { this.kb = ''; this.draft(); this.relayout(); return; }
    if (r.act === 'cancel') { this.kb = null; this.draft(); this.relayout(); return; }
    if (r.act === 'done') {
      const name = this.kb.trim(); this.kb = null; this.draft(); this.relayout();
      if (!name) return;
      this.step = 'car';
      await this.cmd('adddriver', name.replace(/ /g, '_'), '/api/guest/do');
      await this.refreshSoon(250);
      return;
    }
    if (r.act === 'exit') { this.exit(); return; }
    // the choice shows at once; irdash confirms a moment later
    if (r.act === 'driver') { this.step = 'car'; this.hold('driver', String(r.arg).replace(/_/g, ' ').toLowerCase()); }
    if (r.act === 'car') { this.step = 'track'; this.hold('car', r.arg); }
    if (r.act === 'track') { this.step = 'start'; this.hold('track', r.arg); }
    if (r.act === 'wheel') this.hold('wheel', r.arg);
    if (r.act === 'line') this.hold('line', !this.cur('line', this.g.line));
    if (r.act === 'coach') this.hold('coach', !this.cur('coach', this.g.coach));
    if (r.act === 'board') this.hold('board', !this.cur('board', this.g.board));
    this.relayout();
    await this.cmd(r.act, r.arg, '/api/guest/do');
    await this.refreshSoon(250);
  }

  build() {
    const g = this.g, R = [], sel = (on) => on ? 'sel' : '';
    const add = (c, r, w, h, text, sub, act, arg, style) => R.push({ c, r, w, h, text, sub, act, arg, style: style || '' });
    const wheel = this.cur('wheel', g.wheel), line = this.cur('line', g.line), coach = this.cur('coach', g.coach), board = this.cur('board', g.board);
    const carKey = this.cur('car', g.car.key), trackKey = this.cur('track', g.track.key), driverId = this.cur('driver', String(g.driverId).toLowerCase());
    const carName = ((g.carList || []).find(x => x.key === carKey) || g.car).name, trackName = ((g.trackList || []).find(x => x.key === trackKey) || g.track).name;
    const driver = driverId === 'guest' ? 'Guest' : ((g.drivers || []).find(n => n.toLowerCase() === driverId) || g.driver);
    if (this.kb != null) {
      // A-Z keyboard for a new driver's name; the top screen shows the name large as it is typed
      const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      for (let i = 0; i < 24; i++) add(i % 8, Math.floor(i / 8), 1, 1, L[i], '', 'letter', L[i]);
      add(0, 3, 1, 1, 'Y', '', 'letter', 'Y'); add(1, 3, 1, 1, 'Z', '', 'letter', 'Z');
      add(2, 3, 1, 1, 'SPACE', '', 'space'); add(3, 3, 1, 1, '⌫', 'delete', 'bksp');
      add(4, 3, 1, 1, this.kb.length ? this.kb.slice(-7) : 'TYPE', g.voiceDraft ? 'spotter knows it' : 'A NAME', null, null, 'banner', 2);
      add(5, 3, 1, 1, 'CANCEL', '', 'cancel', null, 'grey');
      add(6, 3, 1, 1, 'DONE', '', 'done', null, this.kb.trim().length ? 'go' : 'grey');
      R.push(exitRegion());
      return R;
    }
    if (g.session) {
      // in a session: few, large keys
      add(0, 0, 8, 1, driver, (carName || '') + '  ·  ' + (trackName || ''), null, null, 'banner');
      add(0, 1, 2, 2, 'RESET CAR', '', 'reset', null, 'amber');
      add(2, 1, 2, 2, 'NEXT DRIVER', '', 'next', null, 'gold');
      add(4, 1, 2, 2, 'GET OUT', 'car must be stopped', 'getout', null, 'grey');
      add(6, 1, 1, 1, 'LIGHT', 'WHEEL', 'wheel', 'light', sel(wheel === 'light'));
      add(7, 1, 1, 1, 'MEDIUM', 'WHEEL', 'wheel', 'medium', sel(wheel === 'medium'));
      add(6, 2, 1, 1, 'FULL', 'WHEEL', 'wheel', 'full', sel(wheel === 'full'));
      add(7, 2, 1, 1, 'LINE', line ? 'ON' : 'OFF', 'line', null, line ? 'on' : 'off');
      add(0, 3, 1, 1, 'SEAT', 'LOWER', 'seatdown');
      add(1, 3, 1, 1, 'SEAT', 'HIGHER', 'seatup');
      add(2, 3, 1, 1, 'TIMES', board ? 'ON' : 'OFF', 'board', null, board ? 'on' : 'off');
      add(3, 3, 1, 1, 'COACH', coach ? 'ON' : 'OFF', 'coach', null, coach ? 'on' : 'off');
      add(4, 3, 1, 1, 'VOL', '−', 'voldown');
      add(5, 3, 1, 1, 'VOL', '+', 'volup');
      add(6, 3, 1, 1, 'DRIVE', g.driving ? 'in the car' : '', g.driving ? null : 'start', null, g.driving ? 'grey' : 'go');
      R.push(exitRegion());
    } else {
      // choosing: numbered steps; the step to do next glows, then START
      const step = (n, label, id) => add(0, n - 1, 1, 1, n + '  ' + label, '', null, null, this.step === id ? (this.blink ? 'stepOn' : 'stepOn2') : 'label');
      step(1, 'WHO', 'who');
      const names = (g.drivers || []).slice(0, 4);
      names.forEach((n, i) => add(1 + i, 0, 1, 1, n, '', 'driver', n.replace(/ /g, '_'), sel(driverId === n.toLowerCase())));
      add(1 + names.length, 0, 1, 1, 'GUEST', '', 'driver', 'guest', sel(driverId === 'guest'));
      add(2 + names.length, 0, 1, 1, '+ NEW', '', 'newdriver', null, 'grey');
      add(7, 0, 1, 1, 'LINE', line ? 'ON' : 'OFF', 'line', null, line ? 'on' : 'off');   // W3-4: EXIT took 7,3 (the same place on every screen)
      step(2, 'CAR', 'car');
      (g.carList || []).slice(0, 7).forEach((x, i) => add(1 + i, 1, 1, 1, x.name, /abs|tc/i.test(x.aids) ? 'aids on' : 'no aids', 'car', x.key, sel(carKey === x.key)));
      step(3, 'TRACK', 'track');
      (g.trackList || []).slice(0, 4).forEach((x, i) => add(1 + i, 2, 1, 1, x.name, '', 'track', x.key, sel(trackKey === x.key)));
      add(5, 2, 1, 1, 'LIGHT', 'WHEEL', 'wheel', 'light', sel(wheel === 'light'));
      add(6, 2, 1, 1, 'MEDIUM', 'WHEEL', 'wheel', 'medium', sel(wheel === 'medium'));
      add(7, 2, 1, 1, 'FULL', 'WHEEL', 'wheel', 'full', sel(wheel === 'full'));
      add(0, 3, 7, 1, '4  START', driver + '  ·  ' + (carName || '') + ' at ' + (trackName || ''), 'start', null, this.step === 'start' && this.blink ? 'goBright' : 'go');
      R.push(exitRegion());
    }
    return R;
  }

  paintOver(x) {
    if (!(this.flash && Date.now() < this.flashUntil)) return;
    const f = this.flash, rec = f.kind === 'record';
    x.fillStyle = this.blink ? (rec ? GOLD : GREEN) : C.black; x.fillRect(0, 0, W, H);
    x.fillStyle = this.blink ? C.goldInk : (rec ? GOLD : GREEN); x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '700 64px ' + FONT; x.fillText(rec ? 'NEW RECORD' : 'PERSONAL BEST', W / 2, 120);
    x.font = '600 48px ' + FONT; x.fillText(String(f.name).toUpperCase() + '   ' + fmtTime(f.time), W / 2, 250);
  }
};

// ---------------- Rig Doctor key ----------------
// A key you can put on any page (action "Rig Doctor"): its dot shows the last check (green, amber, red);
// pressing it checks the rig again and shows the list on the top screen. The OVERLAYS screen has the same button.
const RigDoctor = {
  d: null, shown: '', spec: { label: ['RIG', 'DOCTOR'], glyph: 'gauge', role: 'white' },
  icon(force) {
    if (!docKeys.size) return;
    const d = this.d, st = !d || !d.ranAt ? 'none' : d.bad > 0 ? 'bad' : d.warn > 0 ? 'warn' : 'ok';
    const label = !d || !d.ranAt ? 'CHECK' : d.bad + d.warn === 0 ? 'ALL GOOD' : (d.bad + d.warn) + ' TO SEE';
    if (!force && st + label === this.shown) return;
    this.shown = st + label;
    const url = KEYART.keyPng(Object.assign({}, this.spec, { dot: st, note: label }));
    for (const ctx of docKeys) send({ event: 'setImage', context: ctx, payload: { image: url, target: 0 } });
  },
  async tick(sum) {
    if (!docKeys.size || !sum.doctor) return;
    this.d = sum.doctor;
    this.icon(false);
  },
  async press() { try { await sendCmd('/api/do?c=doctor'); } catch (e) { log('doctor: irdash not reachable'); } },
};

// ---------------- Overlays screen ----------------
// One live screen for the race-screen overlays (irdashies) and the delta bar. Gold = on / chosen.
//   rows 1-2: one key per overlay      row 3: presets, SAVE AS, status      row 4: drag mode, ALL OFF, delta bar, doctor, EXIT
// irdash /overlays says what is on; every press goes to irdash /api/do (a whitelist), which runs irdeck. Several quick
// taps cost one restart of the overlays app (irdash waits 1.5 s after the last one). The screen shows a press at
// once, before irdash has confirmed it.
const Overlays = new class extends Screen {
  constructor() {
    super('overlays');
    this.o = null;
    this.held = {};      // id -> { on, until }: what a press changed, shown until irdash confirms
    this.flashes = {};   // 'act' -> until: "SAVED" on the SAVE key for a moment
    this.interval = 600;
  }
  hasState() { return !!this.o; }

  // the OVERLAYS key on your own profile: how many overlays are on
  keyIcon(force) {
    if (!this.keys.size) return;
    const n = this.o ? this.o.onCount : -1, label = n < 0 ? '' : n + ' ON';
    if (!force && label === this.keyShown) return;
    this.keyShown = label;
    this.paintOpener(label);
  }

  async keyTick(sum) {
    if (!this.keys.size || this.live || !sum.overlays) return;
    this.o = sum.overlays;
    this.keyIcon(false);
    this.warm();
  }

  async open(opts) {
    if (!deviceId) return;
    Perf.begin('overlays');
    this.switchTo('RigOverlays'); Perf.mark('overlays', 'switchSent');
    this.fastUntil = performance.now() + 2500;
    if (this.o) this.warm();
  }
  exit() { this.switchTo(''); }   // back to your own keys

  async poll() {
    this.o = await this.get('/overlays');
    this.keyIcon(false);
    this.relayout();
  }
  async refresh() { await this.poll(); }

  async act(r) {
    if (r.act === 'exit') { this.exit(); return; }
    const now = Date.now();
    if (r.act === 'ovtoggle') { const w = this.o.widgets.find(x => x.id === r.arg); if (w) this.held[r.arg] = { on: !this.on(w), until: now + 4000 }; }
    if (r.act === 'ovsave') this.flashes['ovsave'] = now + 1800;
    this.relayout();
    await this.cmd(r.act, r.arg);
    await this.refreshSoon(250);
  }

  on(w) { const h = this.held[w.id]; return h && Date.now() < h.until ? h.on : w.on; }

  build() {
    const o = this.o, R = [], add = (c, r, w, h, text, sub, act, arg, style) => R.push({ c, r, w, h, text, sub, act, arg, style: style || '' });
    const now = Date.now();
    // rows 1-2: the overlays
    o.widgets.forEach((w, i) => {
      const on = this.on(w);
      add(i % 8, Math.floor(i / 8), 1, 1, w.name, w.known ? (on ? 'ON' : 'OFF') : 'not in app', w.known ? 'ovtoggle' : null, w.id, w.known ? (on ? 'sel' : '') : 'dim');   // (was its own 'off' look: the same colours as dim)
    });
    // row 3: presets (gold = the overlays on now are exactly this preset), SAVE AS, status
    o.presets.forEach((p, i) => add(i, 2, 1, 1, p.name, p.match ? 'ON NOW' : (o.saveTo === p.id ? 'BASE' : ''), p.exists ? 'ovpreset' : null, p.id, p.match ? 'sel' : (o.saveTo === p.id ? 'on' : '')));
    const saved = this.flashes['ovsave'] && now < this.flashes['ovsave'];
    add(5, 2, 1, 1, saved ? 'SAVED' : 'SAVE AS', saved ? '' : o.saveTo.toUpperCase(), 'ovsave', o.saveTo, saved ? 'go' : 'amber');
    let st, ss, style = 'banner';
    if (!o.running) { st = 'OVERLAYS OFF'; ss = ''; style = 'stop'; }
    else if (o.waiting) { st = 'WAITING'; ss = 'for the car to stop'; style = 'amber'; }
    else if (o.pending || o.busy) { st = 'UPDATING'; ss = ''; style = 'amber'; }
    else if (o.editing) { st = 'DRAG THEM'; ss = 'then EDIT LAYOUT'; style = 'go'; }
    else { st = o.onCount + ' ON'; ss = o.msg && o.msgAge != null && o.msgAge < 8 ? o.msg : 'up to date'; }   // a note shows for a few seconds
    add(6, 2, 2, 1, st, ss, 'ovapply', null, style);
    // row 4
    add(0, 3, 1, 1, 'EDIT', o.editing ? 'LOCK IT' : 'LAYOUT', o.driving ? null : 'ovedit', null, o.editing ? 'go' : (o.driving ? 'dim' : 'grey'));
    add(1, 3, 1, 1, 'ALL OFF', 'overlays', 'ovalloff', null, 'amber');
    add(2, 3, 1, 1, 'DELTA BAR', o.delta.on ? 'ON' : 'OFF', 'deltaon', null, o.delta.on ? 'sel' : '');
    add(3, 3, 1, 1, 'VS ' + o.delta.ref.toUpperCase(), '', 'deltaref', null, '');
    add(4, 3, 1, 1, 'MOVE ↑', 'delta bar', 'deltaup', null, '');
    add(5, 3, 1, 1, 'MOVE ↓', 'delta bar', 'deltadown', null, '');
    add(6, 3, 1, 1, 'RIG', 'DOCTOR', 'doctor', null, 'grey');
    R.push(exitRegion());
    return R;
  }
};

// ---------------- AI RACE screen (W3-4: MY DRIVE's car and track lists and AI LEVEL folded into one screen; profile RigMyDrive) ----------------
// Opened by AI RACE on MAIN. One page: what to drive (LAST DRIVE, RECENT, CARS, TRACKS, FAVOURITES; the chosen car, track and layout), how
// hard the AI is (LOW / MEDIUM / HIGH, kept by irdash dash\src\ailevel.cs, used by AI RACE in the wizard) and one big START that runs
// AI RACE with them (irdash ailevel start -> irdeck airace start, which writes the start mark). Nothing goes to the sim before START.
// Lists are one key per item: nothing to type (PLAN rule 6). The same choice is what DRIVE (GET IN) starts when nothing is loaded.
// In a session the screen shows the driving keys instead. EXIT at 7,3 like every screen; BACK in a list returns to these keys.
const MyDrive = new class extends Screen {
  constructor() {
    super('mydrive');
    this.m = null; this.lvl = null;                            // the last /mydrive and /ailevel
    this.local = {};                                           // what a press changed, shown until irdash confirms: key -> { v, until }
    this.stSeq = null; this.pinged = 0; this.listsAt = 0; this.lvlAt = 0;
    this.view = 'home'; this.page = 0;                         // the AI RACE keys, or a paged list ('pick')
    this.pickPage = 'recent'; this.pickClass = 'GT3'; this.lists = null; this.pickTrack = null;
  }
  hasState() { return !!this.m && this.m.ready; }
  cur(k, serverValue) { const h = this.local[k]; return h && Date.now() < h.until ? h.v : serverValue; }
  hold(k, v) { this.local[k] = { v, until: Date.now() + 3000 }; }
  repaint() { this.shown = {}; this.relayout(); }

  keyIcon(force) {
    // NO CHOICE (AI RACE pressed with no car chosen): the key says so. The screen never opens by itself (audit 11, A1).
    const noChoice = !!(this.m && this.m.aiStatus === 'NO CHOICE' && !(this.m.choice && this.m.choice.has)), sig = noChoice ? 'nc' : 'ok';
    if (!this.keys.size || (!force && this.keyShown === sig)) return;
    this.keyShown = sig;
    this.paintOpener(noChoice ? 'CHOOSE ONE' : '', noChoice ? 'amber' : '');
  }

  // runs always (even with no AI RACE key on a page): the state for instant drawing, and the speed-test request
  async keyTick() {
    // W0-5: from /deck/summary (the speed-test trigger rides in it); called with no summary it asks /mydrive itself
    const sum = arguments[0], m = sum ? sum.mydrive : await this.get('/mydrive'); if (!m) return;
    if (!this.live) this.m = m;
    const st = m.speedtest;
    if (st) {
      if (this.stSeq === null) this.stSeq = st.seq;
      else if (st.seq !== this.stSeq) { this.stSeq = st.seq; speedTest(st.which); }
    }
    if (this.keys.size && !this.live) { this.keyIcon(false); this.warm(); }
  }

  async open(opts) {
    if (!deviceId) return;
    Perf.begin('mydrive');
    this.local = {}; this.shown = {};
    this.view = 'home'; this.pickPage = 'recent'; this.page = 0;
    // the deck switches at once; the lists follow (a hung irdash used to hold the switch for the 2 s timeout)
    if (!this.lists) this.lists = { recent: [], cars: [], tracks: [] };
    this.switchTo('RigMyDrive'); Perf.mark('mydrive', 'switchSent');
    this.fastUntil = performance.now() + 2500;
    if (!(opts && opts.test)) { this.pinged = performance.now(); this.cmd('mdopen'); this.cmd('mdclear'); }
    if (this.m && this.m.ready) this.warm();
    try { this.lists = await this.get('/mydrive/lists'); this.listsAt = performance.now(); } catch (e) { }
    try { this.lvl = await this.get('/ailevel'); this.lvlAt = performance.now(); } catch (e) { }
    const classes = this.classKeys(); if (classes.length && !classes.includes(this.pickClass)) this.pickClass = classes[0];
    if (this.m && this.m.ready) this.relayout();
  }
  exit(opts) {
    if (!(opts && opts.test)) this.cmd('mdclose');
    this.view = 'home'; this.page = 0;
    this.switchTo('');
  }

  // /mydrive at the screen's pace; the lists every 10 s and the AI level every 5 s (or right after a press): they change rarely
  async poll() {
    this.m = await this.get('/mydrive');
    const now = performance.now();
    if (now - this.listsAt > 10000) { try { this.lists = await this.get('/mydrive/lists'); this.listsAt = now; } catch (e) { } }
    if (now - this.lvlAt > 5000) { try { this.lvl = await this.get('/ailevel'); this.lvlAt = now; } catch (e) { } }
    if (this.m.aiStatus === 'NO CHOICE' && this.view !== 'pick' && !this.m.choice.has) { this.view = 'pick'; this.pickPage = 'recent'; this.page = 0; }
    if (now - this.pinged > 60000) { this.pinged = now; this.cmd('mdopen'); }    // keeps the top screen's card up
    this.relayout();
  }

  async act(r) {
    const m = this.m;
    if (r.act === 'exit') { this.exit(); return; }
    // moving between the AI RACE keys and the lists (nothing is sent to irdash)
    if (r.act === 'home') { this.view = 'home'; this.page = 0; this.pickTrack = null; this.repaint(); return; }
    if (r.act === 'picktab') { this.view = 'pick'; this.pickPage = r.arg; this.page = 0; this.repaint(); return; }
    if (r.act === 'favs') { this.view = 'pick'; this.pickPage = 'favs'; this.page = 0; this.repaint(); return; }
    if (r.act === 'pickclass') { this.pickClass = r.arg; this.page = 0; this.repaint(); return; }
    if (r.act === 'pickpageprev' || r.act === 'pickpagenext') { this.page = Math.max(0, this.page + (r.act === 'pickpagenext' ? 1 : -1)); this.repaint(); return; }
    // a pick: the car goes on to the tracks; a track (or its layout) comes back to the AI RACE keys, where START is
    if (r.act === 'pickcar') { await this.cmd('mdpick', r.arg); this.pickPage = 'tracks'; this.page = 0; this.repaint(); await this.refreshSoon(250); return; }
    if (r.act === 'picktrack') {
      const tr = (this.lists && this.lists.tracks || []).find(x => x.id === r.arg);
      await this.cmd('mdpick', r.arg);
      if (tr && tr.layouts && tr.layouts.length > 1) { this.pickTrack = tr; this.pickPage = 'layouts'; this.page = 0; this.repaint(); return; }
      this.view = 'home'; this.page = 0; this.repaint(); await this.refreshSoon(250); return;
    }
    if (r.act === 'picklayout') { await this.cmd('mdpick', r.arg); this.pickTrack = null; this.view = 'home'; this.page = 0; this.repaint(); await this.refreshSoon(250); return; }
    if (r.act === 'mdpick') {
      // LAST DRIVE, or a drive from RECENT / FAVOURITES: the whole choice changes at once (irdash confirms a moment later)
      const item = [...(m.recent || []), ...(m.all || []), ...(m.favs || []), ...((this.lists && this.lists.recent) || [])].find(x => x.id === r.arg);
      if (item) this.hold('choice', { car: item.car, carShort: item.carShort, track: item.track, trackShort: item.trackShort, layout: item.layout });
      this.view = 'home'; this.page = 0; this.repaint();
      await this.cmd('mdpick', r.arg); await this.refreshSoon(300); return;
    }
    if (r.act === 'ailevel') { if (r.arg !== 'cycle') this.hold('level', r.arg); else delete this.local.level; this.lvlAt = 0; this.relayout(); await this.cmd('ailevel', r.arg); await this.refreshSoon(250); return; }   // cycle = the RANGE key (irdash steps the preset)
    if (r.act === 'aistart') {
      // the AI race with this car, track and level; the deck goes back to MAIN (TO THE RACE, GET OUT ... are there), but only after 0.8 s:
      // a doubled START press must land on START again (once), not on PAUSE / SAVE SPOT / BEST LAP CAR, the MAIN keys under it
      if (this.lvl && this.lvl.kids) return;   // kids mode: the screen says so, nothing is sent (irdash refuses it too)
      let ans = '';
      try { const resp = await sendCmd('/api/do?c=ailevel&a=start'); ans = (await resp.text()).trim(); } catch (e) { log('mydrive: irdash not reachable'); }
      if (ans === 'kids') { this.lvl = Object.assign({}, this.lvl || {}, { kids: true }); this.relayout(); return; }
      await sleep(SWITCH_DEAF_MS);
      this.exit(); return;
    }
    if (r.act === 'mddamage') this.hold('damage', this.cur('damage', m.choice.damage) === 'off' ? 'on' : 'off');
    if (r.act === 'mdstar') { const f = this.cur('fav', m.session && m.current ? m.current.fav : m.choice.fav); this.hold('fav', !f); }
    this.relayout();
    await this.cmd(r.act, r.arg);
    await this.refreshSoon(300);
  }

  isChosen(x) {
    const c = this.cur('choice', null);
    return c ? (c.car === x.car && c.track === x.track && (x.layout === undefined || x.layout === c.layout)) : x.chosen;
  }

  build() {
    const m = this.m, R = [];
    const add = (c, r, w, h, text, sub, act, arg, style, wrap, single, more) => { const o = { c, r, w, h, text: String(text == null ? '' : text).toUpperCase(), sub: String(sub == null ? '' : sub).toUpperCase(), act, arg, style: style || '', wrap: wrap || 0, single: !!single }; if (more) Object.assign(o, more); R.push(o); };
    if (m.session) return this.buildSession(R, add);
    if (m.busy === 'start') {
      // the sim is being set up: nothing to choose now (a pick would change the choice START already used)
      add(0, 0, 8, 3, 'STARTING', m.msg || '', null, null, 'amber', 2);
      add(0, 3, 6, 1, 'Please wait', '', null, null, 'dim');
      add(6, 3, 1, 1, 'CANCEL', '', 'mdcancel', null, 'stop');
      R.push(exitRegion());
      return R;
    }

  // a list, one key per item: RECENT, FAVOURITES, CARS (by class), TRACKS, a track's LAYOUTS. BACK returns to the AI RACE keys.
  buildPicker(R, add) {
    const lists = this.lists || { recent: [], cars: [], tracks: [] };

      add(1, 0, 1, 1, 'RECENT', '', 'picktab', 'recent', this.pickPage === 'recent' ? 'sel' : '');
      add(2, 0, 1, 1, 'CARS', '', 'picktab', 'cars', this.pickPage === 'cars' ? 'sel' : '');
      add(3, 0, 1, 1, 'TRACKS', '', 'picktab', 'tracks', this.pickPage === 'tracks' ? 'sel' : '');
      if (this.pickPage === 'favs') add(4, 0, 1, 1, 'FAVOURITES', '', 'picktab', 'favs', 'sel');
    } else add(1, 0, 1, 1, 'LAYOUT', '', null, null, 'banner');
    let items = this.pickPage === 'recent' ? lists.recent : this.pickPage === 'favs' ? ((this.m && this.m.favs) || []) : this.pickPage === 'cars' ? (lists.cars || []).filter(x => !this.pickClass || x.class === this.pickClass) : this.pickPage === 'tracks' ? lists.tracks : (this.pickTrack ? this.pickTrack.layouts.map(x => ({ name: this.shortLayout(x), id: 'l' + this.hash(this.pickTrack.name + '|' + x) })) : []);

      const main = recentish ? (it.carShort || this.carLines(it.car || '')[0] || it.car) : (this.pickPage === 'cars' ? car[0] : (it.short || it.name || it.car));
      const sub = recentish ? (it.trackShort || it.track) : (this.pickPage === 'cars' ? car[1] : '');

  shortLine(s, n) { s = String(s || '').toUpperCase(); return s.length > n ? s.slice(0, n).trim() : s; }
  classKeys() {
    const rows = (this.lists && this.lists.cars) || [], found = [];
    rows.forEach(x => { const c = String(x.class || 'OTHER').toUpperCase(); if (!found.includes(c)) found.push(c); });
    const order = ['GT3', 'GTP/LMDH', 'GT4', 'OTHER'];
    return order.filter(c => found.includes(c));
  }
  carLines(s) {
    const n = String(s || '').toUpperCase();
    const fixed = { 'CHEVROLET CORVETTE Z06 GT3.R': ['CORVETTE', 'Z06 GT3'], 'FERRARI 296 GT3': ['FERRARI', '296 GT3'] };
    if (fixed[n]) return fixed[n];
    const clean = n.replace(/\s*\([^)]*\)/g, '').replace(/^(CHEVROLET|FERRARI|TOYOTA|PORSCHE|FORD|AUDI|BMW|MCLAREN|MERCEDES-AMG|LAMBORGHINI)\s+/, '');

  shortLayout(s) { const t = { '2K FULL': '2K FULL', 'FULL COURSE': 'FULL COURSE', 'GRAND PRIX': 'GRAND PRIX', 'SHORT COURSE': 'SHORT COURSE' }; return t[String(s || '').toUpperCase()] || this.shortLine(s, 12); }

  //   row 4: RANGE (under HIGH)      START: 3 x 2 keys, green (the only key that runs the sim)      EXIT: 7,3

      add(0, 0, 8, 3, 'KIDS MODE IS ON', 'Unlock first: KIDS, then HOME', null, null, 'amber', 2, false, { size: 38 });

    add(1, 0, 1, 1, 'CARS', '', 'picktab', 'cars', '');
    add(2, 0, 1, 1, 'TRACKS', '', 'picktab', 'tracks', '');
    add(3, 0, 1, 1, 'FAVOURITES', '', favs.length ? 'favs' : null, null, favs.length ? '' : 'dim');
    add(0, 1, 1, 1, has ? this.shortLine(car, 12) : 'CAR', has ? '' : 'CHOOSE ONE', null, null, has ? 'banner' : 'dim', 2, true);
    add(1, 1, 1, 1, has ? this.shortLine(track, 12) : 'TRACK', '', null, null, has ? 'banner' : 'dim', 2, true);
    add(2, 1, 1, 1, 'LAYOUT', has && layout ? this.shortLine(this.shortLayout(layout), 14) : '—', null, null, has ? 'banner' : 'dim', 2, true);
    add(3, 1, 1, 1, 'DAMAGE', damage === 'off' ? 'OFF' : 'ON', 'mddamage', null, damage === 'off' ? 'off' : 'on');
    // how hard the AI is (irdash ailevel.cs): one press each, the lit one is what the next AI race gets; RANGE steps the fixed skill ranges
    const range = !!(lv && lv.mode === 'range' && !this.cur('level', null));
    const level = this.cur('level', lv ? lv.level : 'low');
    add(0, 2, 1, 1, 'AI LEVEL', range ? 'RANGE ' + lv.min + '-' + lv.max : (lv ? 'NEXT RACE' : 'NOT READY'), null, null, 'label', 2);
    [['low', 'LOW', 'EASIER'], ['medium', 'MEDIUM', ''], ['high', 'HIGH', 'HARDER']].forEach(([id, word, sub], i) =>

    add(4, 1, 3, 2, 'START', 'AI RACE', ready ? 'aistart' : null, null, ready ? 'go' : 'dim', 0, false,
      { once: true, paint: raceSpan({ main: [ready ? 'START' : 'CHOOSE'], sub: [ready ? 'AI RACE' : 'A CAR'] }, 3, 2, 30) });
    R.push(exitRegion());
    return R;
  }
  buildSession(R, add) {
    const m = this.m, c = m.current || { carShort: '', trackShort: '', layout: '', fav: false }, fav = this.cur('fav', c.fav);

    add(0, 1, 2, 2, fav ? '★ SAVED' : '★ SAVE', '', c.carShort ? 'mdstar' : null, null, fav ? 'sel' : 'amber', 2);
    add(2, 1, 2, 2, 'DRIVE', m.driving ? 'in the car' : (joining ? 'getting in' : ''), m.driving || joining ? null : 'mdstart', null, m.driving ? 'grey' : 'go');
    add(4, 1, 2, 2, 'GET OUT', 'car must be stopped', 'mdgetout', null, 'grey');
    add(6, 1, 2, 2, m.last ? m.last.secs + ' s' : '–', 'START → IN THE CAR', null, null, 'banner', 1);
    add(0, 3, 2, 1, 'RESET CAR', '', 'mdtow', null, 'amber');
    add(2, 3, 1, 1, 'VOL', '−', 'voldown');
    add(3, 3, 1, 1, 'VOL', '+', 'volup');
    R.push(exitRegion());
    return R;
  }
};

// ---------------- Replay screen ----------------
// iRacing's replay without its menus. Plain big buttons that say what they do NOW; gold = on / chosen / where you are.
//   row 1: PHOTO, the timeline (tap a fifth to jump there), SESSION, LIVE
//   row 2: START, LAP, REWIND, PLAY / PAUSE, FAST, LAP, SLOW MO, BACK 10 S  (REWIND / FAST become one-frame steps while paused)
//   row 3: INCIDENT, INCIDENT, then which car: MY CAR, AHEAD, BEHIND, LEADER, PICK CAR (a list), MY LAST INCIDENT
//   row 4: CAMERA (left half back, right half on), TV, COCKPIT, CHASE, AUTO TV, HIDE UI, EXIT (7,3 on every screen, W3-4; PHOTO moved to 0,0)
// Out of a session: MY REPLAYS (the saved ones; iRacing opens those itself). While you are driving everything is dimmed.
// irdash /replay says what is going on; every press goes to irdash /api/do, which sends iRacing's own SDK messages
// (no clicks, no keys, nothing steals focus). Unicode is written as \u escapes so the file survives any editor.
const RP = { x: '×', minus: '−', left: '◀', right: '▶', dot: '·', arrow: '→', half: '½', quarter: '¼', eighth: '⅛' };
const rpClock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0'); };

const rpNext = (cur, ladder) => { for (const v of ladder) if (v > cur) return v; return 0; };          // the next step up a ladder; 0 = back to normal speed
const RP_FAST = [2, 4, 8, 16], RP_REW = [1, 2, 4, 8, 16], RP_SLOW = [1, 3, 7];
const Replay = new class extends Screen {
  constructor() {

  hasState() { return !!this.r && this.r.ready; }

  // the REPLAY key on your own profile
  keyIcon(force) {

  // while the opener key is on the deck: keep the last state at hand (not drawn: it changes every second, so it is only
  // drawn - once - when the screen opens)
  async keyTick(sum) {

    this.keyIcon(false);
  }

  async open(opts) {
    if (!deviceId) return;
    Perf.begin('replay');
    this.pick = null;
    this.switchTo('RigReplay'); Perf.mark('replay', 'switchSent');
    this.fastUntil = performance.now() + 2500;

  }
  exit() { this.pick = null; this.switchTo(''); }   // back to your own keys

  async poll() {

  async act(r, col) {

    if (r.act === 'pick') { this.pick = { page: 0 }; this.relayout(); return; }
    if (r.act === 'pickback') { this.pick = null; this.relayout(); return; }

    if (r.act === 'rpjump') { await this.cmd('rpjump', String(col - r.c)); await this.refreshSoon(200); return; }

  // ---- what the timeline strip says ----
  stripSnap(st) {

    if (w) sn.r = (w.pos > 0 ? 'P' + w.pos + ' ' + RP.dot + ' ' : '') + '#' + w.num + ' ' + w.name;
    if (st.live) { sn.big = 'LIVE'; sn.live = true; }

    else { sn.big = rpClock(s.time); sn.cap = 'INTO ' + s.name; }

  paintStrip(x, px, py, pw, ph, sn) {
    x.textBaseline = 'middle';

    if (sn.cap) { x.textAlign = 'left'; x.fillStyle = C.muted; x.font = '400 13px ' + FONT; x.fillText(sn.cap, cx + bw0 / 2 + 8, py + 47); }
    if (sn.spd) { x.textAlign = 'right'; x.fillStyle = GOLD; x.font = '600 22px ' + FONT; x.fillText(sn.spd, px + pw - 12, py + 44); }

  }

  // the two camera keys as one picture: the arrows say which half goes which way

    x.textBaseline = 'middle'; x.textAlign = 'center';
    x.fillStyle = dim ? C.fainter : GOLD; x.font = '600 26px ' + FONT; x.fillText(RP.left, px + 20, py + ph / 2); x.fillText(RP.right, px + pw - 20, py + ph / 2);

  build() {

    }
    if (paused) add(3, 1, 1, 1, 'PLAY', 'PAUSED NOW', 'rpplay', null, 'go', 0, { size: 26 });
    else add(3, 1, 1, 1, 'PAUSE', mode === 'live' ? 'LIVE NOW' : mode === 'play' ? 'PLAYING' : 'MOVING', 'rpplay', null, '', 0, { size: 26 });

    add(0, 3, 2, 1, cname, csub, 'cam', null, '', 0, { extra: 'cam' + (dr ? 'D' : ''), paint: (x, px, py, pw, ph) => this.paintCamera(x, px, py, pw, ph, cname.toUpperCase(), csub, dr) });
    add(2, 3, 1, 1, 'TV', cam.tv ? 'BROADCAST VIEW' : 'NOT HERE', cam.tv ? 'rpgroup' : null, 'tv', cam.onTv ? 'sel' : (cam.tv ? '' : 'dim'), 2);
    add(3, 3, 1, 1, 'COCKPIT', cam.cockpit ? 'IN THE CAR' : 'NOT HERE', cam.cockpit ? 'rpgroup' : null, 'cockpit', cam.onCockpit ? 'sel' : (cam.cockpit ? '' : 'dim'), 2);
    add(4, 3, 1, 1, 'CHASE', cam.chase ? 'BEHIND THE CAR' : 'NOT HERE', cam.chase ? 'rpgroup' : null, 'chase', cam.onChase ? 'sel' : (cam.chase ? '' : 'dim'), 2);
    add(5, 3, 1, 1, 'AUTO TV', cam.autoTv ? 'ON' : '', 'rpautotv', null, cam.autoTv ? 'sel' : '', 2);
    add(6, 3, 1, 1, 'HIDE UI', cam.uiHidden ? 'HIDDEN' : '', 'rphideui', null, cam.uiHidden ? 'sel' : '', 2);
    // PHOTO sits top-left (W3-4: EXIT took 7,3, the same place on every screen)
    const ph = st.photo || { state: 'idle' };
    if (ph.capture === 0) add(0, 0, 1, 1, 'PHOTO', 'TURN ON IN IRACING', null, null, 'dim', 3);   // iRacing: Settings, Interface, Camera & Screen Capture (docs\replay.md)
    else if (ph.state === 'working') add(0, 0, 1, 1, 'SNAP', 'TAKING IT', null, null, 'amber', 2);
    else if (ph.state === 'saved') add(0, 0, 1, 1, 'SAVED', 'IN THE GALLERY', null, null, 'go', 2);
    else if (ph.state === 'small') add(0, 0, 1, 1, 'TAKEN', 'TOO SMALL FOR GALLERY', 'rpphoto', null, 'amber', 2);
    else if (ph.state === 'failed') add(0, 0, 1, 1, 'NO PHOTO', 'TAP TO RETRY', 'rpphoto', null, 'stop', 2);
    else add(0, 0, 1, 1, 'PHOTO', 'NO MENUS', 'rpphoto', null, '', 2);
    R.push(exitRegion());
    return R;
  }

  // the list of cars by position: Peter in gold, the car being watched in dark gold, a colour edge per class
  buildPick(R, add, st) {
    const cars = st.cars || [], per = 23, pages = Math.max(1, Math.ceil(cars.length / per));
    this.pick.page = Math.min(this.pick.page, pages - 1);
    const page = this.pick.page;
    add(0, 0, 1, 1, 'BACK', 'TO CONTROLS', 'pickback', null, 'grey', 2);
    add(1, 0, 5, 1, 'PICK A CAR', cars.length + ' CARS' + (pages > 1 ? ' ' + RP.dot + ' PAGE ' + (page + 1) + ' OF ' + pages : '') + ' ' + RP.dot + ' TAP ONE', null, null, 'banner');
    add(6, 0, 1, 1, RP.left + ' PAGE', '', page > 0 ? 'pickprev' : null, null, page > 0 ? 'grey' : 'dim', 2);
    add(7, 0, 1, 1, 'PAGE ' + RP.right, '', page < pages - 1 ? 'picknext' : null, null, page < pages - 1 ? 'grey' : 'dim', 2);
    cars.slice(page * per, page * per + per).forEach((d, i) => {
      add(i % 8, 1 + Math.floor(i / 8), 1, 1, d.pos > 0 ? 'P' + d.pos : '-', '#' + d.num + ' ' + d.name, 'rpcar', String(d.idx), d.me ? 'sel' : (d.watch ? 'watch' : ''), 2, st.multiClass && d.color ? { strip: d.color } : null);
    });
    R.push(exitRegion());   // 23 cars a page: the 24th key is EXIT
    return R;
  }

  // out of a session: the saved replays. They can only be opened from iRacing's own Replay screen (docs\replay.md), so we say so.
  buildReplays(R, add, st) {
    const rp = st.replays || { count: 0, items: [] };
    add(0, 0, 8, 1, 'MY REPLAYS', rp.count ? rp.count + ' SAVED' : 'NONE', null, null, 'banner');
    if (!rp.count) add(0, 1, 8, 2, 'NO SAVED REPLAYS', 'Save one in the sim first', null, null, 'dim', 2);
    else rp.items.slice(0, 8).forEach((it, i) => add((i % 4) * 2, 1 + Math.floor(i / 4), 2, 1, it.name, it.when + (it.where ? ' ' + RP.dot + ' ' + it.where : ''), null, null, '', 2));
    add(0, 3, 7, 1, 'TO WATCH ONE', 'Open it from the sim\'s Replay screen', null, null, 'banner', 2);
    R.push(exitRegion());
    return R;
  }
};

// ---------------- Sound screen ----------------
// Game sound without Windows' mixer (C-39). One column per sound: GAME (the sim), SPOTTER (CrewChief), MUSIC (Spotify), SPEAKERS (the speakers'
// own level), BUTTKICKER (its own level). Top key: the level, + and - below it, MUTE at the bottom (red while muted). RACE / CRUISE / NIGHT set them all
// at once. Windows' default output device and every other Windows setting are never changed. irdash /sound is what irdeck read from Windows; presses go
// to /api/do (snd...). A sound that is not playing right now has no level to set: its keys are dim and say so.
const SND_IDS = ['sim', 'spotter', 'music', 'speakers', 'buttkicker'];
const SND_PRESETS = [['race', 'RACE', 'spotter up, no music'], ['cruise', 'CRUISE', 'music on, spotter low'], ['night', 'NIGHT', 'everything lower']];
const sndShort = n => { const m = /\((.*)\)/.exec(n || ''); return (m ? m[1] : (n || '')).toUpperCase(); };
const Sound = new class extends Screen {
  constructor() {
    super('sound');
    this.s = null;                 // the last /sound
    this.local = {};               // what a press changed, shown until irdeck has done it: key -> { v, until }
    this.interval = 700;
  }
  hasState() { return !!this.s; }
  cur(k, serverValue) { const h = this.local[k]; return h && Date.now() < h.until ? h.v : serverValue; }
  hold(k, v) { this.local[k] = { v, until: Date.now() + 3000 }; }

  // the SOUND key on your own profile
  keyIcon(force) {
    if (!this.keys.size || (!force && this.keyShown)) return;
    this.keyShown = '1'; this.paintOpener();
  }

  // while the opener key is on the deck: the last known state (a peek: irdash does not ask Windows for it)
  async keyTick(sum) {
    if (!this.keys.size || this.live) return;
    this.s = sum.sound || { ready: false, off: true };     // the peek (/sound?peek=1), in the summary
    this.keyIcon(false);
    this.warm();
  }

  async open(opts) {
    if (!deviceId) return;
    Perf.begin('sound');
    this.local = {};
    this.switchTo('RigSound'); Perf.mark('sound', 'switchSent');
    this.fastUntil = performance.now() + 2500;
    if (this.s) this.warm();
  }
  exit() { this.switchTo(''); }   // back to your own keys

  async poll() {
    try { this.s = await this.get('/sound'); } catch (e) { this.s = { ready: false, off: true }; }
    this.relayout();
  }

  async act(r) {
    if (r.act === 'exit') { this.exit(); return; }
    const s = this.s, items = s.items || [];
    if (r.act === 'sndvol') {
      const p = String(r.arg).split(':'), it = items.find(x => x.id === p[0]);
      if (it) this.hold(p[0] + '.vol', Math.max(0, Math.min(100, this.cur(p[0] + '.vol', it.vol) + parseInt(p[1], 10))));
    }
    if (r.act === 'sndmute') { const it = items.find(x => x.id === r.arg); if (it) this.hold(r.arg + '.mute', !this.cur(r.arg + '.mute', it.mute)); }
    this.relayout();
    await this.cmd(r.act, r.arg);
    await this.refreshSoon(700);
  }

  // the top key of a column: name, level as a number and a bar; MUTED in red; "NOT PLAYING" when there is nothing to set
  paintLevel(x, px, py, pw, ph, it, vol, mute) {
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = GOLD; x.font = '600 14px ' + FONT; x.fillText(it.name, px + pw / 2, py + 13);
    if (!it.live) {
      x.fillStyle = C.faint; x.font = '600 16px ' + FONT;
      x.fillText('NOT', px + pw / 2, py + 40); x.fillText(it.kind === 'device' ? 'FOUND' : 'PLAYING', px + pw / 2, py + 60);
      return;
    }
    x.fillStyle = mute ? C.faint : INK; x.font = '600 32px ' + FONT; x.fillText(vol + '%', px + pw / 2, py + 42);
    if (mute) { x.fillStyle = C.redSoft; x.font = '600 14px ' + FONT; x.fillText('MUTED', px + pw / 2, py + 64); }
    const bx = px + 8, bw = pw - 16, by = py + ph - 14;
    x.fillStyle = C.grey; x.fillRect(bx, by, bw, 7);
    x.fillStyle = mute ? C.faint : GOLD; x.fillRect(bx, by, bw * Math.max(0, Math.min(100, vol)) / 100, 7);
  }

  build() {
    const s = this.s, R = [];
    const add = (c, r, w, h, text, sub, act, arg, style, wrap, more) => { const o = { c, r, w, h, text, sub, act, arg, style: style || '', wrap: wrap || 0 }; if (more) Object.assign(o, more); R.push(o); };
    if (!s.ready) {
      add(0, 0, 8, 3, 'SOUND NOT READY', s.off ? 'Needs the dashboard update' : 'Reading sound devices', null, null, 'amber', 2, { size: 38 });
      R.push(exitRegion());
      return R;
    }
    const items = {}; (s.items || []).forEach(it => { items[it.id] = it; });
    SND_IDS.forEach((id, c) => {
      const it = items[id] || { id, name: id.toUpperCase(), kind: 'app', live: false, vol: 0, mute: false };
      const live = it.live, vol = this.cur(id + '.vol', it.vol), mute = this.cur(id + '.mute', it.mute);
      add(c, 0, 1, 1, '', '', null, null, 'strip', 0, { extra: JSON.stringify([it.name, live, vol, mute]), noflash: true, paint: (x, px, py, pw, ph) => this.paintLevel(x, px, py, pw, ph, it, vol, mute) });
      add(c, 1, 1, 1, '+', it.name, live ? 'sndvol' : null, id + ':+10', live ? '' : 'dim', 0, { size: 44 });
      add(c, 2, 1, 1, '−', it.name, live ? 'sndvol' : null, id + ':-10', live ? '' : 'dim', 0, { size: 44 });
      add(c, 3, 1, 1, mute ? 'MUTED' : 'MUTE', '', live ? 'sndmute' : null, id, live ? (mute ? 'stop' : 'grey') : 'dim', 2, { once: true });
    });
    add(5, 0, 3, 1, 'SOUND', s.using ? 'PLAYING ON ' + sndShort(s.using) : 'no output device found', null, null, 'banner', 2);
    SND_PRESETS.forEach((p, i) => add(5 + i, 1, 1, 1, p[1], p[2], 'sndpreset', p[0], s.preset === p[0] ? 'sel' : '', 2));
    if (s.default && s.default !== s.using) add(5, 2, 3, 1, 'WINDOWS DEFAULT', sndShort(s.default), null, null, 'dim', 2);
    R.push(exitRegion());
    return R;
  }
};

// ---------------- AC screen (the rig room's Midea AC, 2026-10-23) ----------------
// One page with everything: power, the room and target temperature, mode, fan, three one-press presets and auto-cool.
// irdash (dash\src\ac.cs) keeps what was pressed and sends it to the AC as ONE command (~7 s through Midea's server), so the keys
// show the new setting at once and several quick presses never queue up as several waits. /ac?live=1 keeps it fresh while open.
const ACMODES = [[2, 'cool', 'COOL'], [1, 'auto', 'AUTO'], [3, 'dry', 'DRY'], [5, 'fan', 'FAN ONLY']];
const ACFANS = [[40, 'low', 'LOW'], [60, 'medium', 'MEDIUM'], [80, 'high', 'HIGH'], [102, 'auto', 'AUTO']];
const ACMODEWORD = { 1: 'AUTO', 2: 'COOLING', 3: 'DRYING', 4: 'HEATING', 5: 'FAN ONLY' };
const Ac = new class extends Screen {
  constructor() {
    super('ac');
    this.s = null;                 // the last /ac
    this.interval = 700;
  }
  hasState() { return !!this.s; }

  // the AC key on MORE: AC, and on / off with the room temperature once it is known
  keyIcon(force) {
    if (!this.keys.size) return;
    const s = this.s || {}, sub = !s.connected ? '' : (s.on ? 'ON' : 'OFF') + (s.room_f != null ? '  ' + s.room_f + '°F' : '');
    if (!force && this.keyShown === sub) return;
    this.keyShown = sub; this.paintOpener(sub, s.connected && s.on ? 'green' : '');
  }

  async keyTick(sum) {
    if (!this.keys.size || this.live) return;
    this.s = sum.ac || { connected: false };
    this.keyIcon(false);
    this.warm();
  }

  async open() {
    if (!deviceId) return;
    Perf.begin('ac');
    this.switchTo('RigAC'); Perf.mark('ac', 'switchSent');
    this.fastUntil = performance.now() + 2500;
    if (this.s) this.warm();
  }
  exit() { this.switchTo(''); }

  async poll() {
    try { this.s = await this.get('/ac?live=1'); } catch (e) { this.s = { connected: false, offline: true }; }
    this.relayout();
  }

  async act(r) {
    if (r.act === 'exit') { this.exit(); return; }
    await this.cmd(r.act, r.arg);
    await this.refreshSoon(150);       // irdash already shows the press; look again almost at once
  }

  // the ROOM key: the room temperature big, what the AC is doing small under it (every label sits on ONE key: the deck's
  // bezels between keys cut through text spread over two keys - first draft, 2026-10-23)
  paintRoom(x, px, py, pw, ph, s) {
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = GOLD; x.font = '600 14px ' + FONT; x.fillText('ROOM', px + pw / 2, py + 15);
    x.fillStyle = INK; x.font = '600 40px ' + FONT; x.fillText(s.room_f != null ? s.room_f + '°F' : '--', px + pw / 2, py + ph / 2 + 2, pw - 8);
    x.font = '600 13px ' + FONT;
    if (s.busy) { x.fillStyle = C.amber; x.fillText('SENDING…', px + pw / 2, py + ph - 15); }
    else { x.fillStyle = s.on ? GREEN : C.stone; x.fillText(s.on ? ACMODEWORD[s.mode] : 'AC OFF', px + pw / 2, py + ph - 15, pw - 8); }
  }

  build() {
    const s = this.s, R = [];
    const add = (c, r, w, h, text, sub, act, arg, style, wrap, more) => { const o = { c, r, w, h, text, sub, act, arg, style: style || '', wrap: wrap || 0, once: true }; if (more) Object.assign(o, more); R.push(o); };
    if (!s.connected || !s.read) {
      add(0, 0, 8, 3, s.offline ? 'DASHBOARD NOT ANSWERING' : !s.connected ? 'AC NOT CONNECTED' : 'READING THE AC', s.connected ? 'One moment' : 'Run Connect AC once (ac folder)', null, null, 'amber', 2, { size: 38 });
      R.push(exitRegion());
      return R;
    }
    // row 1, what is used most: power, the room, the target, the one-press presets
    add(0, 0, 1, 1, s.on ? 'AC ON' : 'AC OFF', s.on ? 'PRESS: OFF' : 'PRESS: ON', 'acpower', null, s.on ? 'go' : 'grey', 0, { size: 26 });
    add(1, 0, 1, 1, '', '', null, null, 'banner', 0, { extra: JSON.stringify([s.room_f, s.on, s.mode, s.busy]), noflash: true, paint: (x, px, py, pw, ph) => this.paintRoom(x, px, py, pw, ph, s) });
    add(2, 0, 1, 1, '−', 'COOLER', 'actemp', '-1', '', 0, { size: 50 });
    add(3, 0, 1, 1, s.target_f + '°F', 'TARGET', null, null, 'banner', 0, { size: 36 });
    add(4, 0, 1, 1, '+', 'WARMER', 'actemp', '+1', '', 0, { size: 50 });
    add(5, 0, 1, 1, 'MAX COOL', '64°F FAN HIGH', 'acpreset', 'max', '', 2);
    add(6, 0, 1, 1, 'COMFORT', '72°F FAN AUTO', 'acpreset', 'comfort', '', 2);
    add(7, 0, 1, 1, 'QUIET', '72°F FAN LOW', 'acpreset', 'quiet', '', 2);
    // row 2: mode (lit = what the AC is doing; nothing lit while it is off)
    ACMODES.concat([[4, 'heat', 'HEAT']]).forEach(([m, arg, label], i) => add(i, 1, 1, 1, label, 'MODE', 'acmode', arg, s.on && s.mode === m ? (m === 4 ? 'amber' : 'sel') : '', 2));
    // row 3: fan
    ACFANS.forEach(([f, arg, label], i) => add(i, 2, 1, 1, label, 'FAN', 'acfan', arg, s.on && s.fan === f ? 'sel' : '', 2));
    // row 4: auto-cool and when it starts, EXIT
    add(0, 3, 1, 1, s.auto ? 'AUTO-COOL ON' : 'AUTO-COOL OFF', s.auto ? (s.paused ? 'PAUSED 1 HOUR' : 'STOPS ' + s.off_below_f + '°F') : 'PRESS: ON', 'acauto', null, s.auto ? (s.paused ? 'amber' : 'sel') : 'grey', 2);
    add(1, 3, 1, 1, '−', 'START', 'acstart', '-1', s.auto ? '' : 'dim', 0, { size: 50 });
    add(2, 3, 1, 1, s.on_above_f + '°F', 'STARTS AT', null, null, 'banner', 0, { size: 36 });
    add(3, 3, 1, 1, '+', 'START', 'acstart', '+1', s.auto ? '' : 'dim', 0, { size: 50 });
    R.push(exitRegion());
    return R;
  }
};
// ---------------- the RIG key (W3-4): a door to the top screen's RIG page, with the rig's state as a dot ----------------
// No screen of its own: a press asks irdash to open RIG on the top screen (/api/nav?to=rig, the same door the screen's own tabs use).
// The dot is the last Rig Doctor check (green all good, amber something to look at, red a fault, grey not checked), from /deck/summary.
// HOME stays the key exe rig-on (it must work when nothing else runs), so the rig dot lives here, on the key that opens the rig page.
const Rig = new class extends Screen {
  constructor() { super('rig'); this.d = null; this.openedAt = 0; }
  hasState() { return true; }
  keyIcon(force) {
    if (!this.keys.size) return;
    const d = this.d, st = !d || !d.ranAt ? 'none' : d.bad > 0 ? 'bad' : d.warn > 0 ? 'warn' : 'ok';
    const note = !d || !d.ranAt ? '' : d.bad + d.warn === 0 ? 'ALL GOOD' : (d.bad + d.warn) + ' TO SEE';
    if (!force && this.keyShown === st + note) return;
    this.keyShown = st + note; this.paintOpener(note, st === 'ok' ? 'green' : st === 'none' ? '' : st === 'bad' ? 'redText' : 'amber', { dot: st });
  }
  async keyTick(sum) { if (!this.keys.size || !sum.doctor) return; this.d = sum.doctor; this.keyIcon(false); }
  // a doubled press (29 ms - 1 s) is one press: the door is already open
  async open() {
    const now = performance.now(); if (now - this.openedAt < 700) return; this.openedAt = now;
    try { await sendCmd('/api/nav?to=rig'); } catch (e) { log('rig: irdash not reachable'); }
  }
  exit() { }
};

// ---------------- RACES screen (W1-5: mirrors the library, dash\src\library.cs) ----------------
// Peter: "full races ... delete when done so I don't nuke the hard drive, then export so I can easily go to YouTube". Paddock films every
// session whole (dash\src\recorder.cs); irdash's library lists them with a picture and a state. This screen shows the same list:
// six cards a page (a picture key + a name key each). The picture opens the race; the name key ticks it (gold frame on both keys).
// Ticked races can be shared or deleted together. A delete leaves at once and offers UNDO for 8 s: nothing asks twice.
const RACE_MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const raceWhen = ms => {
  const d = new Date(ms), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return (same(d, now) ? 'TODAY' : same(d, y) ? 'YESTERDAY' : RACE_MON[d.getMonth()] + ' ' + d.getDate()) + ' ' + hm;
};
const raceDay = ms => raceWhen(ms).replace(/ \d\d:\d\d$/, '');           // the card key is small: the day, not the time
const raceLap = t => { if (!(t > 0)) return '--'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); };
// a race (not qualifying or practice): what the RACES list shows unless ALL SESSIONS is on (Peter 2026-11-12: too much to wade through)
const isRace = x => x.isRace !== undefined ? !!x.isRace : /race/i.test(x.type || '') && !/qual|prac/i.test(x.type || '');
const raceShortType = t => /race/i.test(t || '') ? '' : /qual/i.test(t || '') ? 'QUALI · ' : /prac|warm/i.test(t || '') ? 'PRACTICE · ' : /test|offline/i.test(t || '') ? 'TEST · ' : t ? String(t).toUpperCase() + ' · ' : '';
const raceMin = x => Math.max(1, Math.round((x.sec != null ? x.sec : (x.min || 0) * 60) / 60));
const RED = C.redText, AMBER = C.amber;
// the one state line of a race, in the colour-by-job language: gold = busy, green = done, red = broke, amber = needs you, grey = nothing
const raceState = x => {
  const st = x.state || {}, k = st.kind || 'none', pct = Math.round(st.pct || 0), err = String(st.error || '').trim();
  switch (k) {
    case 'sharing': return { k, word: 'SHARING ' + pct + '%', long: 'SHARING ' + pct + '%', col: GOLD, style: 'sel' };
    case 'queued': return { k, word: 'WAITING', long: 'WAITING TO SHARE', why: err.slice(0, 40), col: GOLD, style: 'sel' };
    case 'shared': return { k, word: 'ON YT', long: 'ON YOUTUBE' + (st.privacy === 'public' ? '' : ' (PRIVATE)'), col: GREEN, style: 'go' };
    case 'failed': return { k, word: (err.split(/\s+/)[0] || 'FAILED').toUpperCase().slice(0, 9), long: 'SHARE FAILED' + (err ? ': ' + err : ''), col: RED, style: 'stop' };
    case 'signin': return { k, word: 'SIGN IN', long: 'SIGN IN TO YOUTUBE', col: AMBER, style: 'amber' };
    case 'offline': return { k, word: 'OFFLINE', long: 'NO INTERNET', col: C.muted, style: 'grey' };
  }
  return { k: 'none', word: '', long: 'NOT SHARED', col: C.muted, style: 'grey' };
};
// W1-6 TALK OVER IT: a race being talked over (the screen becomes the talking view), its counter, the microphone's name in short
// ("Default - Microphone (2- Arctis Nova 7P)" -> "ARCTIS NOVA 7P")
const raceTalking = x => /^(preparing|talking|mixing)$/.test((x.talk || {}).kind || '');
const raceClock = s => { s = Math.max(0, Math.floor(s || 0)); const m = Math.floor(s / 60); return (m < 10 ? '0' : '') + m + ':' + String(s % 60).padStart(2, '0'); };
const raceMic = m => { let s = String(m || '').replace(/^(default|communications)\s*-\s*/i, '').trim(); const p = /\((?:\d+-\s*)?([^()]+)\)\s*$/.exec(s); if (p) s = p[1]; return s || 'MICROPHONE'; };
// track name for the card key: at most 2 lines of 8 characters (a longer word breaks with a hyphen)
const raceTrackLines = name => {
  const out = []; let cur = '';
  for (let w of String(name || 'RACE').toUpperCase().split(/\s+/).filter(Boolean)) {
