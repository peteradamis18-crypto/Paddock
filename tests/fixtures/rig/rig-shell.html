<!doctype html>
<!-- The fixture shell for tests\rig-test.ps1 (W5-1): the shell's own header and page box (shell.css), the W3-1 page contract
     (mount / unmount, the ctx), a pretend irdash behind fetch and a stand-in for data.js whose state parts the test pushes.
     The test fills /*FX*/ (the /perf answers), /*SETUP*/ (which state) and <!--RUN--> (the checks). Nothing reaches the real irdash. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="shell.css"><script src="lib/format.js"></script>
<script>
window.__fx = { /*FX*/ };
// the state parts, as irdash pushes them (names and shapes from evidence 17 and the card's contracts)
const H = (deck, cc, ov, ui, sim) => ({ apps: [{ id: 'deck', name: 'Stream Deck', state: deck }, { id: 'ui', name: 'iRacing UI', state: ui || 'off' }, { id: 'sim', name: 'Sim', state: sim || 'off' }]
  .concat(cc ? [{ id: 'cc', name: 'CrewChief', state: cc }] : []).concat(ov ? [{ id: 'overlays', name: 'Overlays', state: ov }] : []), events: [] });
const SET = { startupSound: true, mic: '', mics: [{ name: 'Headset (Arctis 7P+)', default: true }, { name: 'Microphone (Realtek USB2.0 Audio)', default: false }] };
const AC = { connected: true, read: true, on: true, mode: 2, fan: 102, target_c: 22, target_f: 72, room_f: 75, auto: true, paused: false, on_above_f: 76, off_below_f: 72, busy: false, age: 3 };
const QUIET = { setup: true, on: true, since: 1794590000000, say: 'Quiet while you race: Windows Update, search and OneDrive paused.',
  items: [{ id: 'update', name: 'Windows Update', state: 'paused' }, { id: 'search', name: 'Search indexing', state: 'paused' }, { id: 'onedrive', name: 'OneDrive', state: 'paused' }, { id: 'simprio', name: 'Sim priority', state: 'on' }] };
window.__states = {
  ready: { health: H('ok', 'ok', 'ok'), doctor: { running: false }, rig: {}, settings: SET, ac: AC },
  'deck-down': { health: H('down', 'ok', 'ok'), doctor: { running: false }, rig: {}, settings: SET, ac: AC },
  'two-faults': { health: H('ok', 'off', 'off'), doctor: { running: false }, rig: {}, settings: SET, ac: AC },
  'iracing-open': { health: H('ok', 'ok', 'ok', 'ok', 'off'), doctor: { running: false }, rig: {}, settings: SET, ac: AC },
  'in-session': { health: H('ok', 'ok', 'off', 'ok', 'live'), doctor: { running: false }, rig: { sessionOn: true, driving: true }, settings: SET, ac: AC },
  'not-installed': { health: H('ok', null, null), doctor: { running: false }, rig: {}, settings: SET, ac: { connected: false } },
  checking: { health: H('down', 'ok', 'ok'), doctor: { running: true }, rig: {}, settings: SET, ac: AC },
  'quiet-on': { health: H('ok', 'ok', 'ok'), doctor: { running: false }, rig: {}, settings: SET, ac: AC, quiet: QUIET, nightly: { at: '2026-11-14T03:00:00', text: 'Rig check 03:00: all good', ok: true } },
  'quiet-off': { health: H('ok', 'ok', 'ok'), doctor: { running: false }, rig: {}, settings: SET, ac: AC, quiet: { setup: false } },
  'ac-off': { health: H('ok', 'ok', 'ok'), doctor: { running: false }, rig: {}, settings: SET, ac: { connected: false } },
};
window.__setup = { state: 'ready', perf: 'perf-12nov', online: true, opts: {} };
/*SETUP*/
window.__req = []; window.__go = []; window.__ls = {}; window.__timers = [];
// timers started by the page itself (the stack names pages/rig.js): the page asks for nothing on a timer
['setTimeout', 'setInterval', 'requestAnimationFrame'].forEach(k => { const f = window[k]; window[k] = function () { if (/pages\/rig\.js/.test(new Error().stack || '')) window.__timers.push(k); return f.apply(window, arguments); }; });
const mk = n => (window.__ls[n] = window.__ls[n] || []);
const all = st => { const c = {}; for (const k in st) c[k] = true; return c; };
window.data = { __paddock: true, state: {}, seq: 0, online: window.__setup.online !== false,
  get rig() { const r = this.state.rig || {}; return { driving: !!r.driving, sessionOn: !!r.sessionOn, simRunning: !!r.simRunning, online: this.online }; },
  at() { return 0; },
  // as data.js: a late subscriber to 'state' gets what is known at once
  on(n, f) { mk(n).push(f); if (n === 'state' && this.seq >= 0) { try { f(this.state, all(this.state)); } catch (e) { console.error(e); } } return () => { const l = mk(n), i = l.indexOf(f); if (i >= 0) l.splice(i, 1); }; },
  onList(n, f) { return this.on('list:' + n, f); },
  json(u) { return window.fetch(u).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); },
  fetch(u, o) { return window.fetch(u, o); } };
window.__emit = (n, a, b) => mk(n).slice().forEach(f => f(a, b));
// a push of some parts (null = the part is gone), as the stream's event: state
window.__push = parts => { const ch = {}; for (const k in parts) { if (parts[k] === null) delete window.data.state[k]; else window.data.state[k] = parts[k]; ch[k] = true; } window.data.seq++; window.__emit('state', window.data.state, ch); };
window.__use = name => { window.data.state = JSON.parse(JSON.stringify(window.__states[name])); window.__server.settings = window.data.state.settings ? JSON.parse(JSON.stringify(window.data.state.settings)) : null; };
// the pretend irdash
window.__server = { settings: null };
const J = (o, code) => Promise.resolve(new Response(typeof o === 'string' ? o : JSON.stringify(o), { status: code || 200 }));
window.fetch = (u) => { u = String(u); window.__req.push(u);
  if (window.__fail) return Promise.reject(new TypeError('Failed to fetch'));
  if (u === '/perf') return window.__setup.perf === 'fail' ? J('{"error":"x"}', 500) : J(window.__fx[window.__setup.perf]);
  if (u === '/api/doctor/run?quiet=1') { setTimeout(() => window.__push({ doctor: { running: true } }), 0); return J('ok'); }
  const m = /^\/api\/do\?c=([a-z]+)(?:&a=(.*))?$/.exec(u);
  if (m) {
    const c = m[1], a = decodeURIComponent(m[2] || ''), S = window.__server.settings;
    if (c === 'startupsound' || c === 'mic') {
      // the same rules as dash/src/rigpage.cs
      let say = null;
      if (c === 'startupsound' && (a === 'on' || a === 'off')) { S.startupSound = a === 'on'; say = a === 'on' ? 'Start-up sound on' : 'Start-up sound off'; }
      if (c === 'mic') {
        const order = [''].concat(S.mics.map(x => x.name));
        let pick = null;
        if (a === 'next') pick = order[(Math.max(0, order.findIndex(n => n.toLowerCase() === S.mic.toLowerCase())) + 1) % order.length];
        else if (a === 'default') pick = '';
        else { const f = S.mics.find(x => x.name.toLowerCase() === a.toLowerCase()); if (f) pick = f.name; }
        if (pick !== null) { S.mic = pick; say = pick ? 'Mic: ' + pick : "Mic: Windows' default"; }
      }
      if (say === null) return J({ ok: false, say: 'Not done' }, 400);
      setTimeout(() => window.__push({ settings: JSON.parse(JSON.stringify(S)) }), 0);
      return J(Object.assign({ ok: true, say }, S));
    }
    if (/^ac/.test(c)) return J('ok');
  }
  return J('{}', 404); };
window.__fetch = window.fetch;
addEventListener('keydown', e => { if (e.key === 'Escape' && !e.defaultPrevented) window.__go.push(['home', {}]); });
</script></head><body>
<header class="shell-top"><span class="brand">Paddock</span><span class="dot">&middot;</span><span class="date">Sat 14 Nov</span>
<nav class="doors"><button class="door">Home</button><button class="door">Races</button><button class="door">Review</button><button class="door on">Rig</button></nav>
<button class="btn shell-close">Close</button></header>
<main id="page"></main><div id="banner" class="banner shell-banner offline" hidden></div><pre id="out" hidden></pre>
<script type="module">
import rig, * as M from './pages/rig.js';
const page = document.getElementById('page');
const ctx = o => ({ data: window.data, Fmt: window.Fmt, opts: o || {}, go: (n, x) => window.__go.push([n, x || {}]), close() { window.__go.push(['home', {}]); },
  kidsOn: () => false, driving: () => false, banner: () => { } });
window.__mount = o => { rig.mount(page, ctx(o === undefined ? window.__setup.opts : o)); };
window.__unmount = () => { rig.unmount(); page.innerHTML = ''; };
window.__offline = on => { window.data.online = !on; const b = document.getElementById('banner'); b.hidden = !on; b.textContent = on ? 'Paddock is not running. Press HOME on the deck.' : ''; window.__emit('online', !on); };
window.__M = M; window.__rig = rig;
(async () => {
  const S = window.__setup;
  window.__use(S.state);
  if (S.online === false) { window.data.online = false; const b = document.getElementById('banner'); b.hidden = false; b.textContent = 'Paddock is not running. Press HOME on the deck.'; }
  if (S.stale) { window.__mount(); await new Promise(r => setTimeout(r, 300)); window.__unmount(); window.__mount(); window.__offline(true); }
  else window.__mount();
  if (window.__run) window.__run();
})();
</script>
<!--RUN-->
</body></html>
