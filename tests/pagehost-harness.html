<!doctype html>
<html><head><meta charset="utf-8"><title>pagehost harness</title></head>
<body>
<span id="idleSessions">Sessions</span>
<pre id="out"></pre>
<script>
// Offline harness for dash\www\v2\pagehost.js (tests\pagehost-test.ps1 opens it in headless Chrome from disk).
// irdash is a mock here: no network, no live app.
window.$ = id => document.getElementById(id);
window.setHTML = (el, h) => { if (typeof el === 'string') el = $(el); if (el) el.innerHTML = h; };
window.esc = s => String(s);
window.isNum = x => typeof x === 'number' && isFinite(x);
// declared like core.js and ui.js do (const, so NOT window.UI / window.L): a lookup through window would fail here as in production
const UI = { live: () => window.__live };
const L = { v: {} };
// the two other layers that can cover the dashboard (debrief-v4.js after a session, home.js REVIEW), as small mocks
const Debrief4 = { _el: null, root() { return this._el; }, hide() { this._el = null; } };
const HomeHost = { el: null, close() { this.el = null; } };
window.__live = false;
window.NAV = { '/nav': { to: '', seq: 1 }, '/vault/nav': { to: '', seq: 1, enabled: true }, '/perf/nav': { to: '', seq: 1 } };
window.SENT = []; window.LOSE_CLOSE = false;
const CMDS = { '/api/nav?to=sessions': ['/nav', 'sessions'], '/api/nav?to=coach': ['/nav', 'coach'], '/api/nav?to=home': ['/nav', ''], '/api/do?c=vkopen': ['/vault/nav', 'vault'], '/api/do?c=vkclose': ['/vault/nav', ''], '/api/do?c=perf': ['/perf/nav', 'perf'], '/api/do?c=perfclose': ['/perf/nav', ''] };
window.fetch = url => {
  SENT.push(url);
  if (NAV[url]) return Promise.resolve({ json: () => Promise.resolve(Object.assign({}, NAV[url])) });
  const c = CMDS[url];
  if (c && !(LOSE_CLOSE && c[1] === '')) { const n = NAV[c[0]]; if (n.to !== c[1]) { n.to = c[1]; n.seq++; } }
  return Promise.resolve({ json: () => Promise.resolve({ ok: true }) });
};
</script>
<!-- W0-5: irdash pushes its page requests (state parts nav, vaultNav, perfNav); the pretend data.js pushes the mock's flags -->
<script src="tools/fake-data.js"></script>
<script>__watch(() => ({ nav: NAV['/nav'], vaultNav: NAV['/vault/nav'], perfNav: NAV['/perf/nav'] }));</script>
<script src="../dash/www/v2/pagehost.js"></script>
<script src="../dash/www/v2/nav.js"></script>
<script>
const out = [];
const check = (what, ok) => out.push((ok ? 'ok    ' : 'FAIL  ') + what);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const open = id => !!document.getElementById(id);
const deck = (nav, to) => { const n = NAV[nav]; n.to = to; n.seq++; };
(async () => {
  try {
    await sleep(1700);
    check('nothing opens at start when irdash asks for nothing', !open('sessHost') && !open('vaultHost') && !open('perfHost'));
    deck('/nav', 'sessions'); await sleep(1700);
    check('a NEW Stream Deck request opens Sessions', open('sessHost'));
    check('it has a CLOSE button drawn by the dashboard itself', !!document.querySelector('#sessHost .pg-close'));
    LOSE_CLOSE = true;                                   // the close request never reaches irdash (the old code re-opened here)
    document.querySelector('#sessHost .pg-close').click(); await sleep(6200);
    check('CLOSE closes it, and it stays closed even when irdash still says "sessions"', !open('sessHost') && NAV['/nav'].to === 'sessions');
    LOSE_CLOSE = false;
    deck('/nav', 'sessions'); await sleep(1700);
    check('the next NEW request opens it again', open('sessHost'));
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await sleep(300);
    check('Esc closes it from anywhere, and irdash is told', !open('sessHost') && NAV['/nav'].to === '');
    SessionsHost.open(true); await sleep(100);
    await sleep(600);
    deck('/nav', 'coach'); await sleep(1700);
    check('the deck DEBRIEF key (irdash asks for coach) opens the coach page for the last outing', open('coachHost') && /coach\.html\?id=last/.test(document.querySelector('#coachHost iframe').getAttribute('src')));
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await sleep(300);
    check('Esc closes the coach page too', !open('coachHost'));
    HomeHost.el = {}; deck('/nav', 'sessions'); await sleep(1700);
    check('Sessions opened while HOME\'s review is up: the review goes', open('sessHost') && !HomeHost.el);
    PageHost.closeOthers('db4', true); await sleep(300);
    check('the after-session coach coming up closes the open page and tells irdash', !open('sessHost') && NAV['/nav'].to === '');
    deck('/perf/nav', 'perf'); await sleep(1700);
    check('a Performance request opens Performance', open('perfHost'));
    window.__live = true; L.v.IsOnTrack = 1; await sleep(1700);
    check('getting in the car closes it', !open('perfHost'));
    deck('/nav', 'sessions'); const n0 = SENT.length; await sleep(3200);
    check('while driving nothing opens and nothing is requested', !open('sessHost') && SENT.length === n0);
  } catch (e) { out.push('FAIL  harness error: ' + e.message); }
  document.getElementById('out').textContent = out.join('\n') + '\nDONE';
})();
</script>
</body></html>
